<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1110"/>
      <stop offset="0.5" stop-color="#241413"/>
      <stop offset="1" stop-color="#2a1410"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.30" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.78" cy="0.64" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.55" cy="0.16" r="0.42">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#sky)"/>
  <rect width="1600" height="800" fill="url(#glowA)"/>
  <rect width="1600" height="800" fill="url(#glowB)"/>
  <rect width="1600" height="800" fill="url(#glowC)"/>

  <!-- 미세 격자 -->
  <g stroke="#d6a08f" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 0V800M200 0V800M400 0V800M600 0V800M800 0V800M1000 0V800M1200 0V800M1400 0V800M1600 0V800"/>
    <path d="M0 0H1600M0 160H1600M0 320H1600M0 480H1600M0 640H1600M0 800H1600"/>
  </g>

  <!-- 쇳물(molten) 흐름 — 래들에서 흐르는 용강 띠 -->
  <g fill="none" stroke="#ff7a45" stroke-opacity="0.12" stroke-width="2.5">
    <path d="M -50 250 Q 400 330 800 270 T 1650 300"/>
    <path d="M -50 560 Q 400 630 800 580 T 1650 600"/>
  </g>
  <g fill="none" stroke="#ffb072" stroke-opacity="0.08" stroke-width="2">
    <path d="M -50 320 Q 400 400 800 340 T 1650 360"/>
    <path d="M -50 185 Q 500 135 1000 205 T 1650 175"/>
  </g>

  <!-- 슬래브/코일/I-빔 실루엣(하단 압연 라인) -->
  <g stroke="#c98a72" stroke-opacity="0.18" stroke-width="2.2" fill="none" stroke-linejoin="round">
    <!-- 코일(원형 강판 두루마리) -->
    <g transform="translate(225 520)">
      <ellipse cx="0" cy="60" rx="58" ry="60"/>
      <ellipse cx="0" cy="60" rx="20" ry="21"/>
      <path d="M-58 60 H-20 M20 60 H58" stroke-opacity="0.10"/>
    </g>
    <!-- I-빔(H형강) -->
    <g transform="translate(800 500)">
      <path d="M-44 0 H44 M-44 170 H44 M0 0 V170 M-34 8 H34 M-34 162 H34"/>
    </g>
    <!-- 슬래브 적층 -->
    <g transform="translate(1320 560)">
      <rect x="-70" y="0" width="140" height="22" rx="3"/>
      <rect x="-60" y="30" width="120" height="22" rx="3"/>
      <rect x="-50" y="60" width="100" height="22" rx="3"/>
    </g>
  </g>

  <!-- 용광로 불꽃·스파크 -->
  <g fill="#ffd9a0">
    <circle cx="180" cy="200" r="2.4" opacity="0.5"/>
    <circle cx="640" cy="120" r="1.8" opacity="0.4"/>
    <circle cx="600" cy="250" r="1.5" opacity="0.5"/>
    <circle cx="1120" cy="220" r="2.6" opacity="0.42"/>
    <circle cx="1420" cy="150" r="1.6" opacity="0.34"/>
    <circle cx="420" cy="640" r="2.2" opacity="0.36"/>
    <circle cx="980" cy="700" r="1.8" opacity="0.3"/>
    <circle cx="1300" cy="300" r="1.6" opacity="0.4"/>
  </g>
</svg>
