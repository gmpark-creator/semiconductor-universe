<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08160f"/>
      <stop offset="0.5" stop-color="#0a2118"/>
      <stop offset="1" stop-color="#0c2a2a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.28" cy="0.30" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.80" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.55" cy="0.16" r="0.42">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#sky)"/>
  <rect width="1600" height="800" fill="url(#glowA)"/>
  <rect width="1600" height="800" fill="url(#glowB)"/>
  <rect width="1600" height="800" fill="url(#glowC)"/>

  <!-- 이온 흐름(Li+ migration) — 충·방전 전류 흐름 곡선 -->
  <g fill="none" stroke="#4ade80" stroke-opacity="0.10" stroke-width="2">
    <path d="M -50 250 Q 400 330 800 270 T 1650 300"/>
    <path d="M -50 320 Q 400 410 800 350 T 1650 380"/>
    <path d="M -50 520 Q 400 600 800 540 T 1650 560"/>
    <path d="M -50 590 Q 400 670 800 610 T 1650 630"/>
  </g>
  <g fill="none" stroke="#5eead4" stroke-opacity="0.07" stroke-width="2">
    <path d="M -50 170 Q 500 120 1000 190 T 1650 160"/>
    <path d="M -50 680 Q 500 740 1000 690 T 1650 720"/>
  </g>

  <!-- 미세 격자(grid) -->
  <g stroke="#7fd6b0" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 0V800M200 0V800M400 0V800M600 0V800M800 0V800M1000 0V800M1200 0V800M1400 0V800M1600 0V800"/>
    <path d="M0 0H1600M0 160H1600M0 320H1600M0 480H1600M0 640H1600M0 800H1600"/>
  </g>

  <!-- 원통형 배터리 셀 실루엣(하단) — 단자(+) 포함 -->
  <g stroke="#5fae8a" stroke-opacity="0.18" stroke-width="2.2" fill="none" stroke-linejoin="round">
    <g transform="translate(230 520)">
      <rect x="-26" y="0" width="52" height="170" rx="14"/>
      <rect x="-9" y="-12" width="18" height="12" rx="3"/>
      <path d="M-26 36 H26 M-26 134 H26" stroke-opacity="0.12"/>
    </g>
    <g transform="translate(800 490)">
      <rect x="-30" y="0" width="60" height="200" rx="16"/>
      <rect x="-10" y="-14" width="20" height="14" rx="3"/>
      <path d="M-30 42 H30 M-30 158 H30" stroke-opacity="0.12"/>
    </g>
    <g transform="translate(1340 530)">
      <rect x="-24" y="0" width="48" height="160" rx="13"/>
      <rect x="-8" y="-11" width="16" height="11" rx="3"/>
      <path d="M-24 34 H24 M-24 126 H24" stroke-opacity="0.12"/>
    </g>
  </g>

  <!-- 충전 번개(charge) 모티프 -->
  <g fill="#a3e635" fill-opacity="0.10">
    <path d="M560 250 L600 250 L575 300 L615 300 L545 380 L565 320 L530 320 Z"/>
    <path d="M1080 180 L1108 180 L1090 215 L1118 215 L1068 270 L1082 228 L1058 228 Z"/>
  </g>

  <!-- 보케 빛점 -->
  <g fill="#d3f5e2">
    <circle cx="180" cy="180" r="2.2" opacity="0.4"/>
    <circle cx="640" cy="120" r="1.8" opacity="0.32"/>
    <circle cx="1120" cy="220" r="2.6" opacity="0.36"/>
    <circle cx="1420" cy="140" r="1.6" opacity="0.28"/>
    <circle cx="420" cy="640" r="2.2" opacity="0.3"/>
    <circle cx="980" cy="700" r="1.8" opacity="0.26"/>
    <circle cx="1300" cy="620" r="2.4" opacity="0.32"/>
  </g>
</svg>
