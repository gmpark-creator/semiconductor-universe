<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.35" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </radialGradient>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <rect x="20" y="20" width="440" height="280" rx="14" fill="#080b18" stroke="#25314d"/>
  <text x="30" y="44" fill="#e2e8f0" font-size="19" font-weight="700">은하와 우주의 진화</text>
  <text x="30" y="66" fill="#94a3b8" font-size="11">은하 구조, 적색 편이, 우주 팽창, 우주 배경 복사로 우주의 역사를 읽는다</text>

  <g transform="translate(68 112)">
    <ellipse cx="82" cy="62" rx="74" ry="32" fill="url(#core)" opacity="0.9"/>
    <path d="M82 62 C38 22 6 42 18 68 C28 92 62 88 82 62 C126 102 158 82 146 56 C136 32 102 36 82 62 Z" fill="none" stroke="#a5b4fc" stroke-width="3"/>
    <circle cx="82" cy="62" r="12" fill="#fef3c7"/>
    <g fill="#e0e7ff">
      <circle cx="34" cy="44" r="2"/>
      <circle cx="58" cy="84" r="1.6"/>
      <circle cx="118" cy="40" r="1.8"/>
      <circle cx="142" cy="76" r="1.5"/>
      <circle cx="92" cy="94" r="1.3"/>
    </g>
    <text x="82" y="124" fill="#cbd5e1" font-size="12" text-anchor="middle">우리은하와 성간 물질</text>
  </g>

  <g transform="translate(270 96)">
    <line x1="0" y1="42" x2="128" y2="42" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="70" x2="128" y2="70" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="98" x2="128" y2="98" stroke="#64748b" stroke-width="2"/>
    <line x1="22" y1="28" x2="22" y2="112" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="54" y1="28" x2="54" y2="112" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="92" y1="28" x2="92" y2="112" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="40" y1="42" x2="40" y2="126" stroke="#fb7185" stroke-width="3"/>
    <line x1="78" y1="42" x2="78" y2="126" stroke="#fb7185" stroke-width="3"/>
    <line x1="118" y1="42" x2="118" y2="126" stroke="#fb7185" stroke-width="3"/>
    <path d="M26 138 H112" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="64" y="20" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">적색 편이</text>
    <text x="64" y="158" fill="#94a3b8" font-size="10" text-anchor="middle">스펙트럼 선이 긴 파장 쪽으로 이동</text>
  </g>

  <g transform="translate(74 250)" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow-purple)">
    <path d="M72 0 L18 -28"/>
    <path d="M86 0 L142 -30"/>
    <path d="M78 6 L40 34"/>
    <path d="M92 6 L132 34"/>
  </g>
  <circle cx="158" cy="252" r="10" fill="#818cf8"/>
  <text x="158" y="292" fill="#94a3b8" font-size="10" text-anchor="middle">공간 팽창: 은하 사이 거리 증가</text>

  <g transform="translate(304 244)">
    <circle cx="44" cy="18" r="36" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="44" cy="18" r="22" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.8"/>
    <text x="44" y="15" fill="#e2e8f0" font-size="10" text-anchor="middle">우주</text>
    <text x="44" y="29" fill="#e2e8f0" font-size="10" text-anchor="middle">배경 복사</text>
    <text x="44" y="68" fill="#94a3b8" font-size="10" text-anchor="middle">초기 우주의 흔적</text>
  </g>
