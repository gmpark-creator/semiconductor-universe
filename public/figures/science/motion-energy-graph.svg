<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">운동 그래프와 에너지 전환</text>
  <!-- 시간-거리 그래프 -->
  <g transform="translate(40,70)">
    <text x="90" y="-6" fill="#cbd5e1" font-size="11" text-anchor="middle">시간–거리 그래프</text>
    <line x1="0" y1="120" x2="0" y2="0" stroke="#64748b" stroke-width="1.5"/>
    <line x1="0" y1="120" x2="170" y2="120" stroke="#64748b" stroke-width="1.5"/>
    <text x="-8" y="8" fill="#94a3b8" font-size="9" text-anchor="end">거리</text>
    <text x="170" y="134" fill="#94a3b8" font-size="9" text-anchor="end">시간</text>
    <line x1="0" y1="120" x2="150" y2="20" stroke="#38bdf8" stroke-width="3"/>
    <text x="120" y="58" fill="#7dd3fc" font-size="9">기울기=속력</text>
    <line x1="150" y1="20" x2="170" y2="20" stroke="#34d399" stroke-width="3"/>
    <text x="150" y="14" fill="#6ee7b7" font-size="8">정지</text>
  </g>
  <!-- 에너지 전환: 롤러코스터 -->
  <g transform="translate(250,70)">
    <text x="110" y="-6" fill="#cbd5e1" font-size="11" text-anchor="middle">역학적 에너지 전환</text>
    <path d="M0 10 Q40 10 80 110 Q120 10 200 110" fill="none" stroke="#475569" stroke-width="3"/>
    <circle cx="6" cy="14" r="8" fill="#f59e0b"/>
    <text x="6" y="-2" fill="#fcd34d" font-size="8" text-anchor="middle">위치E↑</text>
    <circle cx="80" cy="106" r="8" fill="#f87171"/>
    <text x="80" y="128" fill="#fca5a5" font-size="8" text-anchor="middle">운동E↑</text>
  </g>
  <text x="240" y="232" fill="#cbd5e1" font-size="12" text-anchor="middle">일 = 힘 × 이동거리 (단위 J). 에너지 = 일할 수 있는 능력</text>
  <text x="240" y="262" fill="#94a3b8" font-size="11" text-anchor="middle">마찰 없으면 운동E + 위치E = 역학적E 일정(보존)</text>
</svg>
