<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">입자 모형으로 본 상태 변화</text>
  <g text-anchor="middle">
    <!-- 고체 -->
    <rect x="40" y="70" width="100" height="90" rx="8" fill="#13203a" stroke="#22d3ee"/>
    <g fill="#67e8f9"><circle cx="62" cy="92" r="7"/><circle cx="82" cy="92" r="7"/><circle cx="102" cy="92" r="7"/><circle cx="122" cy="92" r="7"/><circle cx="62" cy="114" r="7"/><circle cx="82" cy="114" r="7"/><circle cx="102" cy="114" r="7"/><circle cx="122" cy="114" r="7"/><circle cx="62" cy="136" r="7"/><circle cx="82" cy="136" r="7"/><circle cx="102" cy="136" r="7"/><circle cx="122" cy="136" r="7"/></g>
    <text x="90" y="180" fill="#a5f3fc" font-size="13" font-weight="700">고체</text>
    <!-- 액체 -->
    <rect x="190" y="70" width="100" height="90" rx="8" fill="#13203a" stroke="#38bdf8"/>
    <g fill="#7dd3fc"><circle cx="212" cy="120" r="7"/><circle cx="234" cy="112" r="7"/><circle cx="256" cy="124" r="7"/><circle cx="276" cy="114" r="7"/><circle cx="222" cy="142" r="7"/><circle cx="248" cy="146" r="7"/><circle cx="272" cy="140" r="7"/></g>
    <text x="240" y="180" fill="#bae6fd" font-size="13" font-weight="700">액체</text>
    <!-- 기체 -->
    <rect x="340" y="70" width="100" height="90" rx="8" fill="#13203a" stroke="#a5b4fc"/>
    <g fill="#c7d2fe"><circle cx="360" cy="86" r="6"/><circle cx="420" cy="100" r="6"/><circle cx="390" cy="128" r="6"/><circle cx="362" cy="150" r="6"/><circle cx="426" cy="146" r="6"/></g>
    <text x="390" y="180" fill="#c7d2fe" font-size="13" font-weight="700">기체</text>
  </g>
  <!-- 변화 화살표 -->
  <g font-size="11" text-anchor="middle">
    <text x="165" y="100" fill="#f87171" font-weight="700">융해→</text><text x="165" y="148" fill="#60a5fa">←응고</text>
    <text x="315" y="100" fill="#f87171" font-weight="700">기화→</text><text x="315" y="148" fill="#60a5fa">←액화</text>
  </g>
  <path d="M90 70 C200 30 330 30 410 64" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#st)"/>
  <text x="250" y="34" fill="#fde68a" font-size="11" text-anchor="middle">승화 (고체 ↔ 기체)</text>
  <text x="240" y="232" fill="#cbd5e1" font-size="12" text-anchor="middle">입자 사이가 멀어지는 변화(융해·기화)는 열 흡수 / 가까워지는 변화는 열 방출</text>
  <text x="240" y="258" fill="#94a3b8" font-size="11" text-anchor="middle">상태가 변하는 동안 온도는 일정 — 이때 드나드는 열이 잠열</text>
  <defs><marker id="st" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#fbbf24"/></marker></defs>
</svg>
