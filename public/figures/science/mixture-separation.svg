<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">혼합물을 분리하는 방법</text>
  <g text-anchor="middle">
    <!-- 체 -->
    <g><rect x="30" y="70" width="100" height="92" rx="10" fill="#13203a" stroke="#fbbf24"/>
      <path d="M44 110 h72" stroke="#94a3b8" stroke-width="2"/><g stroke="#94a3b8"><line x1="52" y1="110" x2="52" y2="116"/><line x1="64" y1="110" x2="64" y2="116"/><line x1="76" y1="110" x2="76" y2="116"/><line x1="88" y1="110" x2="88" y2="116"/><line x1="100" y1="110" x2="100" y2="116"/></g>
      <circle cx="60" cy="98" r="5" fill="#a3e635"/><circle cx="92" cy="100" r="5" fill="#a3e635"/>
      <circle cx="64" cy="132" r="2.5" fill="#fcd34d"/><circle cx="84" cy="138" r="2.5" fill="#fcd34d"/>
      <text x="80" y="180" fill="#fde68a" font-size="11">체 (알갱이 크기)</text></g>
    <!-- 자석 -->
    <g><rect x="150" y="70" width="100" height="92" rx="10" fill="#13203a" stroke="#f87171"/>
      <rect x="184" y="84" width="32" height="14" fill="#ef4444"/><rect x="184" y="98" width="32" height="6" fill="#94a3b8"/>
      <g fill="#cbd5e1"><rect x="186" y="120" width="6" height="6"/><rect x="200" y="124" width="6" height="6"/><rect x="208" y="116" width="6" height="6"/></g>
      <text x="200" y="180" fill="#fca5a5" font-size="11">자석 (철)</text></g>
    <!-- 거름 -->
    <g><rect x="270" y="70" width="100" height="92" rx="10" fill="#13203a" stroke="#38bdf8"/>
      <path d="M298 86 L342 86 L320 120 Z" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="314" cy="98" r="3" fill="#a16207"/><circle cx="326" cy="100" r="3" fill="#a16207"/>
      <line x1="320" y1="120" x2="320" y2="140" stroke="#7dd3fc" stroke-width="2"/>
      <path d="M306 140 h28 v8 h-28 z" fill="#1e3a5f"/>
      <text x="320" y="180" fill="#7dd3fc" font-size="11">거름 (안 녹는 것)</text></g>
    <!-- 증발 -->
    <g><rect x="390" y="70" width="60" height="92" rx="10" fill="#13203a" stroke="#34d399"/>
      <path d="M404 120 h32 v14 a4 4 0 0 1 -4 4 h-24 a4 4 0 0 1 -4 -4 z" fill="#1e3a5f"/>
      <g stroke="#6ee7b7" stroke-width="1.5"><path d="M412 116 q4 -8 0 -14"/><path d="M428 116 q4 -8 0 -14"/></g>
      <g fill="#fef08a"><rect x="414" y="130" width="4" height="4"/><rect x="424" y="132" width="4" height="4"/></g>
      <text x="420" y="180" fill="#6ee7b7" font-size="10">증발 (소금)</text></g>
  </g>
  <text x="240" y="232" fill="#cbd5e1" font-size="12" text-anchor="middle">혼합물 속 물질은 성질이 그대로 → 알맞은 방법으로 다시 분리</text>
  <text x="240" y="262" fill="#94a3b8" font-size="11" text-anchor="middle">바닷물을 증발시켜 소금을 얻는 염전이 좋은 예</text>
</svg>
