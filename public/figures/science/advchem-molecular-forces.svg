<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">분자 사이의 힘</text>
  <!-- 물 분자 수소 결합 -->
  <g transform="translate(120,140)">
    <g>
      <circle cx="0" cy="0" r="20" fill="#22d3ee" stroke="#0891b2"/><text x="0" y="5" fill="#082f49" font-size="12" text-anchor="middle" font-weight="700">O</text>
      <circle cx="-22" cy="-16" r="11" fill="#e2e8f0"/><text x="-22" y="-12" fill="#334155" font-size="9" text-anchor="middle">H</text>
      <circle cx="22" cy="-16" r="11" fill="#e2e8f0"/><text x="22" y="-12" fill="#334155" font-size="9" text-anchor="middle">H</text>
    </g>
    <g transform="translate(70,52)">
      <circle cx="0" cy="0" r="20" fill="#22d3ee" stroke="#0891b2"/><text x="0" y="5" fill="#082f49" font-size="12" text-anchor="middle" font-weight="700">O</text>
      <circle cx="-22" cy="-16" r="11" fill="#e2e8f0"/><text x="-22" y="-12" fill="#334155" font-size="9" text-anchor="middle">H</text>
      <circle cx="22" cy="-16" r="11" fill="#e2e8f0"/><text x="22" y="-12" fill="#334155" font-size="9" text-anchor="middle">H</text>
    </g>
    <line x1="22" y1="-12" x2="48" y2="36" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="58" y="6" fill="#fde68a" font-size="9">수소 결합</text>
  </g>
  <g transform="translate(280,82)">
    <text x="0" y="0" fill="#cbd5e1" font-size="10.5" font-weight="700">분자 사이 힘(화학결합보다 약함)</text>
    <text x="0" y="20" fill="#94a3b8" font-size="9">분산력: 모든 분자 / 분자 클수록 ↑</text>
    <text x="0" y="38" fill="#94a3b8" font-size="9">극성 분자 사이 힘: +와 − 끌림</text>
    <text x="0" y="56" fill="#fde68a" font-size="9">수소 결합: F·O·N–H 가장 강함</text>
    <text x="0" y="82" fill="#a5f3fc" font-size="9">→ 물의 높은 끓는점, 얼음이 물에 뜸</text>
  </g>
  <text x="240" y="252" fill="#cbd5e1" font-size="10.5" text-anchor="middle">분자 사이 힘이 셀수록 끓는점·녹는점이 높다</text>
  <text x="240" y="276" fill="#94a3b8" font-size="10" text-anchor="middle">비슷한 것끼리 잘 녹는다 — 극성↔극성, 무극성↔무극성</text>
  <text x="240" y="300" fill="#94a3b8" font-size="10" text-anchor="middle">DNA 두 가닥도 수소 결합으로 마주 붙어 있다</text>
</svg>
