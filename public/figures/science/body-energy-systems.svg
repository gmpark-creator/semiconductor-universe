<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">동물의 에너지 — 네 기관계의 협력</text>
  <g text-anchor="middle">
    <g><rect x="34" y="80" width="92" height="60" rx="10" fill="#13203a" stroke="#fcd34d"/><text x="80" y="106" font-size="20">🍚</text><text x="80" y="128" fill="#fde68a" font-size="12" font-weight="700">소화·흡수</text></g>
    <g><rect x="142" y="80" width="92" height="60" rx="10" fill="#13203a" stroke="#60a5fa"/><text x="188" y="106" font-size="20">🫁</text><text x="188" y="128" fill="#93c5fd" font-size="12" font-weight="700">호흡</text></g>
    <g><rect x="250" y="80" width="92" height="60" rx="10" fill="#13203a" stroke="#f87171"/><text x="296" y="106" font-size="20">❤️</text><text x="296" y="128" fill="#fca5a5" font-size="12" font-weight="700">순환</text></g>
    <g><rect x="358" y="80" width="92" height="60" rx="10" fill="#13203a" stroke="#a5b4fc"/><text x="404" y="106" font-size="20">💧</text><text x="404" y="128" fill="#c7d2fe" font-size="12" font-weight="700">배설</text></g>
  </g>
  <text x="80" y="170" fill="#94a3b8" font-size="9.5" text-anchor="middle">영양소</text>
  <text x="188" y="170" fill="#94a3b8" font-size="9.5" text-anchor="middle">산소</text>
  <text x="296" y="170" fill="#94a3b8" font-size="9.5" text-anchor="middle">온몸 운반</text>
  <text x="404" y="170" fill="#94a3b8" font-size="9.5" text-anchor="middle">노폐물 제거</text>
  <g transform="translate(240,238)">
    <circle cx="0" cy="0" r="34" fill="#13203a" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="-2" font-size="16" text-anchor="middle">⚡</text><text x="0" y="16" fill="#6ee7b7" font-size="11" text-anchor="middle">세포 에너지</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#b2)">
    <path d="M80 142 q60 50 130 70"/><path d="M188 142 q26 44 44 60"/><path d="M296 142 q-26 44 -44 60"/><path d="M404 142 q-60 50 -130 70"/>
  </g>
  <text x="240" y="300" fill="#94a3b8" font-size="11" text-anchor="middle">영양소 + 산소 → 에너지, 노폐물은 배설 → 항상성 유지</text>
  <defs><marker id="b2" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#64748b"/></marker></defs>
</svg>
