<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">열역학과 열기관</text>
  <text x="240" y="70" fill="#fde047" font-size="15" font-weight="800" text-anchor="middle">Q = ΔU + W</text>
  <text x="240" y="90" fill="#94a3b8" font-size="10" text-anchor="middle">가한 열 = 내부에너지 증가 + 기체가 한 일</text>
  <!-- 열기관 흐름 -->
  <g transform="translate(0,110)">
    <rect x="180" y="40" width="120" height="56" rx="10" fill="#13203a" stroke="#f59e0b"/>
    <text x="240" y="64" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">열기관</text>
    <text x="240" y="84" fill="#cbd5e1" font-size="10" text-anchor="middle">엔진·터빈</text>
    <!-- 고온 -->
    <rect x="40" y="44" width="80" height="48" rx="8" fill="#7f1d1d"/><text x="80" y="73" fill="#fff" font-size="11" text-anchor="middle">고온</text>
    <line x1="120" y1="68" x2="178" y2="68" stroke="#ef4444" stroke-width="5" marker-end="url(#th)"/><text x="150" y="58" fill="#fca5a5" font-size="9" text-anchor="middle">Q흡수</text>
    <!-- 일 -->
    <line x1="240" y1="38" x2="240" y2="6" stroke="#34d399" stroke-width="5" marker-end="url(#th)"/><text x="278" y="20" fill="#6ee7b7" font-size="10">일 W</text>
    <!-- 저온 -->
    <rect x="360" y="44" width="80" height="48" rx="8" fill="#1e3a8a"/><text x="400" y="73" fill="#fff" font-size="11" text-anchor="middle">저온</text>
    <line x1="302" y1="68" x2="358" y2="68" stroke="#60a5fa" stroke-width="5" marker-end="url(#th)"/><text x="330" y="58" fill="#93c5fd" font-size="9" text-anchor="middle">Q방출</text>
  </g>
  <text x="240" y="252" fill="#cbd5e1" font-size="12" text-anchor="middle">열효율 = 한 일 ÷ 흡수한 열 (항상 100% 미만 — 열역학 2법칙)</text>
  <text x="240" y="280" fill="#94a3b8" font-size="11" text-anchor="middle">자동차 엔진 효율은 보통 30~40%</text>
  <defs><marker id="th" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="context-stroke"/></marker></defs>
</svg>
