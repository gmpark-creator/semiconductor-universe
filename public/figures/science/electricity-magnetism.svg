<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">전기 회로와 전류의 자기 작용</text>
  <!-- 회로 -->
  <text x="120" y="74" fill="#cbd5e1" font-size="12" text-anchor="middle">옴의 법칙: 전류 = 전압 ÷ 저항</text>
  <rect x="40" y="92" width="160" height="110" rx="8" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <rect x="96" y="84" width="48" height="16" fill="#0f1729"/><line x1="110" y1="84" x2="110" y2="100" stroke="#1e293b"/><line x1="130" y1="86" x2="130" y2="98" stroke="#1e293b"/>
  <text x="120" y="80" fill="#fcd34d" font-size="9" text-anchor="middle">전압(전지)</text>
  <rect x="84" y="194" width="32" height="16" fill="#f87171"/><text x="100" y="226" fill="#fca5a5" font-size="9" text-anchor="middle">저항</text>
  <circle cx="180" cy="148" r="12" fill="#fde047"/>
  <g fill="#7dd3fc" font-size="9"><text x="40" y="148">전류 →</text></g>
  <!-- 전자석 -->
  <g transform="translate(280,90)">
    <text x="100" y="-4" fill="#cbd5e1" font-size="12" text-anchor="middle">전류의 자기 작용 → 전자석</text>
    <rect x="40" y="40" width="120" height="20" rx="4" fill="#94a3b8"/>
    <g stroke="#fbbf24" stroke-width="3" fill="none"><path d="M50 40 q8 -16 16 0 q8 16 16 0 q8 -16 16 0 q8 16 16 0 q8 -16 16 0 q8 16 16 0"/></g>
    <text x="34" y="56" fill="#ef4444" font-size="13" font-weight="800">N</text><text x="166" y="56" fill="#3b82f6" font-size="13" font-weight="800">S</text>
    <g fill="none" stroke="#64748b" stroke-width="1.2"><path d="M40 50 C0 0 200 0 160 50"/></g>
    <text x="100" y="100" fill="#94a3b8" font-size="9.5" text-anchor="middle">전류 끊으면 자석 성질 사라짐</text>
  </g>
  <text x="240" y="278" fill="#94a3b8" font-size="11" text-anchor="middle">전기 에너지 → 빛·열·운동. 안전장치(퓨즈·차단기)로 화재·감전 예방</text>
</svg>
