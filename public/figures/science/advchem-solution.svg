<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">용액과 농도</text>
  <!-- 용해(수화) -->
  <g transform="translate(110,150)">
    <circle cx="0" cy="0" r="60" fill="#1e3a5f33" stroke="#60a5fa" stroke-dasharray="4 3"/>
    <circle cx="0" cy="0" r="16" fill="#f59e0b"/><text x="0" y="4" fill="#1f2937" font-size="9" text-anchor="middle" font-weight="700">이온</text>
    <g fill="#22d3ee">
      <circle cx="-28" cy="-14" r="5"/><circle cx="28" cy="-14" r="5"/><circle cx="-28" cy="14" r="5"/><circle cx="28" cy="14" r="5"/><circle cx="0" cy="-30" r="5"/><circle cx="0" cy="30" r="5"/>
    </g>
    <text x="0" y="80" fill="#a5f3fc" font-size="9.5" text-anchor="middle">물 분자가 이온을 둘러쌈</text>
  </g>
  <g transform="translate(250,80)">
    <text x="0" y="0" fill="#cbd5e1" font-size="10.5" font-weight="700">용액 = 용질 + 용매</text>
    <text x="0" y="18" fill="#94a3b8" font-size="9">비슷한 것끼리 잘 녹는다(극성↔극성)</text>
    <text x="0" y="40" fill="#cbd5e1" font-size="10.5" font-weight="700">농도</text>
    <text x="0" y="58" fill="#94a3b8" font-size="9">퍼센트 농도 · 몰 농도(mol/L)</text>
    <text x="0" y="82" fill="#cbd5e1" font-size="10.5" font-weight="700">묽은 용액의 총괄성</text>
    <text x="0" y="100" fill="#fbbf24" font-size="9">입자 수로 결정 — 끓는점 오름,</text>
    <text x="0" y="116" fill="#fbbf24" font-size="9">어는점 내림, 삼투압</text>
  </g>
  <text x="240" y="252" fill="#cbd5e1" font-size="10.5" text-anchor="middle">포화 용액에서는 녹는 속도 = 석출 속도(용해 평형)</text>
  <text x="240" y="276" fill="#94a3b8" font-size="10" text-anchor="middle">겨울 도로의 염화 칼슘 — 어는점 내림으로 눈을 녹임</text>
  <text x="240" y="300" fill="#94a3b8" font-size="10" text-anchor="middle">배추 절이기·식물 뿌리의 물 흡수는 삼투 현상</text>
</svg>
