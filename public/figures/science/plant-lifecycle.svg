<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">배추흰나비의 한살이</text>
  <g text-anchor="middle">
    <!-- 알 -->
    <g><ellipse cx="80" cy="150" rx="14" ry="20" fill="#fde68a"/><text x="80" y="200" fill="#e2e8f0" font-size="13" font-weight="700">알</text></g>
    <!-- 애벌레 -->
    <g><g fill="#84cc16"><circle cx="180" cy="150" r="11"/><circle cx="194" cy="150" r="11"/><circle cx="208" cy="150" r="11"/><circle cx="222" cy="150" r="11"/></g><text x="200" y="200" fill="#e2e8f0" font-size="13" font-weight="700">애벌레</text></g>
    <!-- 번데기 -->
    <g><path d="M300 130 q18 4 18 22 q0 22 -18 24 q-18 -2 -18 -24 q0 -18 18 -22z" fill="#a16207"/><text x="300" y="200" fill="#e2e8f0" font-size="13" font-weight="700">번데기</text></g>
    <!-- 나비 -->
    <g transform="translate(410,150)"><g fill="#f1f5f9"><path d="M0 0 q-30 -28 -38 0 q-8 22 38 8z"/><path d="M0 0 q30 -28 38 0 q8 22 -38 8z"/><path d="M0 4 q-24 22 -30 2 q-2 -16 30 -6z"/><path d="M0 4 q24 22 30 2 q2 -16 -30 -6z"/></g><rect x="-2" y="-14" width="4" height="34" rx="2" fill="#1e293b"/><text x="0" y="50" fill="#e2e8f0" font-size="13" font-weight="700">어른벌레(나비)</text></g>
  </g>
  <!-- 화살표 -->
  <g stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#l1)">
    <line x1="104" y1="150" x2="156" y2="150"/>
    <line x1="240" y1="150" x2="276" y2="150"/>
    <line x1="324" y1="150" x2="366" y2="150"/>
  </g>
  <path d="M410 230 q-160 56 -330 -56" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#l1)"/>
  <text x="240" y="300" fill="#94a3b8" font-size="11" text-anchor="middle">번데기 단계를 거치는 한살이 = 완전 탈바꿈</text>
  <defs><marker id="l1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#34d399"/></marker></defs>
</svg>
