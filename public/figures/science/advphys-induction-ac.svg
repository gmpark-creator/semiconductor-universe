<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">전자기 유도와 교류</text>
  <!-- 자석+코일 -->
  <g transform="translate(60,100)">
    <rect x="0" y="0" width="50" height="26" rx="3" fill="#7f1d1d" stroke="#f87171"/><text x="25" y="18" fill="#fecaca" font-size="11" text-anchor="middle" font-weight="700">N</text>
    <line x1="50" y1="13" x2="92" y2="13" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#in)"/><text x="70" y="6" fill="#fdba74" font-size="9">이동</text>
    <g stroke="#22d3ee" stroke-width="2.2" fill="none">
      <ellipse cx="118" cy="13" rx="7" ry="20"/><ellipse cx="132" cy="13" rx="7" ry="20"/><ellipse cx="146" cy="13" rx="7" ry="20"/>
    </g>
    <circle cx="180" cy="13" r="14" fill="#13203a" stroke="#34d399"/><text x="180" y="17" fill="#6ee7b7" font-size="9" text-anchor="middle">A</text>
    <text x="120" y="56" fill="#a5f3fc" font-size="9" text-anchor="middle">코일</text>
    <text x="95" y="-12" fill="#94a3b8" font-size="9">자기장 변화 → 유도 전류</text>
  </g>
  <!-- 교류 사인파 -->
  <g transform="translate(60,180)">
    <line x1="0" y1="40" x2="360" y2="40" stroke="#475569"/>
    <path d="M0 40 Q30 0 60 40 Q90 80 120 40 Q150 0 180 40 Q210 80 240 40 Q270 0 300 40 Q330 80 360 40" fill="none" stroke="#f59e0b" stroke-width="2.4"/>
    <text x="180" y="96" fill="#fdba74" font-size="10" text-anchor="middle">교류 — 크기·방향이 주기적으로 변함</text>
  </g>
  <g transform="translate(280,90)">
    <text x="0" y="0" fill="#94a3b8" font-size="9">패러데이: 유도전압 ∝ 자기선속 변화율</text>
    <text x="0" y="16" fill="#94a3b8" font-size="9">렌츠: 변화를 방해하는 방향(에너지 보존)</text>
    <text x="0" y="32" fill="#94a3b8" font-size="9">변압기: 감은 수 비로 전압 변환(교류만)</text>
  </g>
  <text x="240" y="300" fill="#94a3b8" font-size="11" text-anchor="middle">발전기는 코일을 돌려 교류를 만든다 — 전동기의 정반대 에너지 전환</text>
  <defs><marker id="in" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f59e0b"/></marker></defs>
</svg>
