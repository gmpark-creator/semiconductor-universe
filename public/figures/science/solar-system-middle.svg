<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#070b18"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">태양계 — 두 무리의 행성</text>
  <circle cx="40" cy="120" r="34" fill="#f59e0b"/><text x="40" y="170" fill="#fbbf24" font-size="11" text-anchor="middle">태양</text>
  <!-- 지구형 -->
  <rect x="86" y="78" width="180" height="84" rx="10" fill="none" stroke="#38bdf8" stroke-dasharray="4 3"/>
  <text x="176" y="74" fill="#7dd3fc" font-size="11" text-anchor="middle">지구형(작고 단단)</text>
  <g text-anchor="middle" font-size="9" fill="#cbd5e1">
    <circle cx="110" cy="120" r="5" fill="#9ca3af"/><text x="110" y="138">수성</text>
    <circle cx="150" cy="120" r="7" fill="#fcd34d"/><text x="150" y="140">금성</text>
    <circle cx="194" cy="120" r="8" fill="#38bdf8"/><text x="194" y="142">지구</text>
    <circle cx="240" cy="120" r="6" fill="#f87171"/><text x="240" y="138">화성</text>
  </g>
  <!-- 목성형 -->
  <rect x="278" y="64" width="186" height="112" rx="10" fill="none" stroke="#fbbf24" stroke-dasharray="4 3"/>
  <text x="371" y="60" fill="#fcd34d" font-size="11" text-anchor="middle">목성형(크고 기체)</text>
  <g text-anchor="middle" font-size="9" fill="#cbd5e1">
    <circle cx="310" cy="120" r="18" fill="#fbbf24"/><text x="310" y="150">목성</text>
    <circle cx="360" cy="120" r="14" fill="#fcd34d"/><ellipse cx="360" cy="120" rx="22" ry="6" fill="none" stroke="#e2e8f0"/><text x="360" y="150">토성</text>
    <circle cx="408" cy="120" r="10" fill="#67e8f9"/><text x="408" y="146">천왕성</text>
    <circle cx="440" cy="120" r="9" fill="#60a5fa"/><text x="440" y="146">해왕성</text>
  </g>
  <!-- 달 위상 -->
  <g transform="translate(0,210)" text-anchor="middle" font-size="9.5" fill="#cbd5e1">
    <text x="240" y="0" fill="#e2e8f0" font-size="12" font-weight="700">달의 위상</text>
    <g fill="#e2e8f0"><path d="M70 30 a16 16 0 1 0 0.1 0 z" fill="#1e293b"/><path d="M70 14 a16 16 0 0 1 0 32 z" fill="#1e293b"/></g>
    <circle cx="70" cy="30" r="16" fill="none" stroke="#64748b"/><text x="70" y="64">초승</text>
    <path d="M150 14 a16 16 0 0 1 0 32 z" fill="#e2e8f0"/><circle cx="150" cy="30" r="16" fill="none" stroke="#64748b"/><text x="150" y="64">상현</text>
    <circle cx="230" cy="30" r="16" fill="#e2e8f0"/><text x="230" y="64">보름</text>
    <path d="M310 14 a16 16 0 0 0 0 32 z" fill="#e2e8f0"/><circle cx="310" cy="30" r="16" fill="none" stroke="#64748b"/><text x="310" y="64">하현</text>
    <text x="410" y="26" font-size="10">일직선이면</text><text x="410" y="42" font-size="10">일식·월식</text>
  </g>
</svg>
