<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">파동의 표현과 빛의 반사·굴절</text>
  <!-- 파동 -->
  <g>
    <path d="M30 110 q22 -34 44 0 t44 0 t44 0 t44 0" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="30" y1="110" x2="206" y2="110" stroke="#475569" stroke-dasharray="3 3"/>
    <line x1="52" y1="110" x2="52" y2="84" stroke="#34d399" stroke-width="1.5"/><text x="64" y="92" fill="#6ee7b7" font-size="10">진폭</text>
    <path d="M52 128 H140" stroke="#fbbf24" stroke-width="1.5"/><text x="96" y="142" fill="#fde68a" font-size="10" text-anchor="middle">파장</text>
  </g>
  <text x="118" y="68" fill="#cbd5e1" font-size="10" text-anchor="middle">진동수 = 1초당 진동 횟수</text>
  <!-- 반사·굴절 -->
  <g transform="translate(250,76)">
    <text x="100" y="6" fill="#cbd5e1" font-size="11" text-anchor="middle">반사 / 굴절</text>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#94a3b8"/>
    <rect x="0" y="60" width="200" height="60" fill="#1e3a5f" opacity="0.5"/>
    <text x="20" y="50" fill="#7dd3fc" font-size="9">공기</text><text x="20" y="100" fill="#7dd3fc" font-size="9">물</text>
    <!-- 입사 -->
    <line x1="60" y1="6" x2="100" y2="60" stroke="#facc15" stroke-width="2.5"/>
    <!-- 반사 -->
    <line x1="100" y1="60" x2="140" y2="6" stroke="#fb923c" stroke-width="2.5" marker-end="url(#l2)"/>
    <text x="148" y="14" fill="#fdba74" font-size="9">반사</text>
    <!-- 굴절 -->
    <line x1="100" y1="60" x2="120" y2="118" stroke="#f87171" stroke-width="2.5" marker-end="url(#l2)"/>
    <text x="128" y="116" fill="#fca5a5" font-size="9">굴절</text>
    <line x1="100" y1="20" x2="100" y2="110" stroke="#475569" stroke-dasharray="3 3"/>
  </g>
  <text x="240" y="280" fill="#94a3b8" font-size="11" text-anchor="middle">흰빛은 여러 색 → 프리즘·렌즈로 색과 상을 만든다</text>
  <defs><marker id="l2" markerWidth="8" markerHeight="8" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="context-stroke"/></marker></defs>
</svg>
