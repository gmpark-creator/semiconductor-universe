<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#070b18"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">별 → 은하 → 우주</text>
  <!-- 별 색·밝기 -->
  <g text-anchor="middle">
    <circle cx="70" cy="100" r="16" fill="#60a5fa"/><text x="70" y="134" fill="#93c5fd" font-size="9">푸른 별(고온)</text>
    <circle cx="150" cy="100" r="13" fill="#fde047"/><text x="150" y="134" fill="#fde68a" font-size="9">노란 별</text>
    <circle cx="222" cy="100" r="11" fill="#f87171"/><text x="222" y="134" fill="#fca5a5" font-size="9">붉은 별(저온)</text>
  </g>
  <text x="146" y="74" fill="#cbd5e1" font-size="10" text-anchor="middle">밝기는 등급으로 — 숫자 작을수록 밝음</text>
  <!-- 광년 -->
  <text x="370" y="96" fill="#a5f3fc" font-size="11" text-anchor="middle">광년 = 빛이 1년 간 거리</text>
  <text x="370" y="116" fill="#94a3b8" font-size="9.5" text-anchor="middle">별빛은 과거의 모습</text>
  <!-- 은하 -->
  <g transform="translate(150,220)">
    <ellipse cx="0" cy="0" rx="100" ry="34" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <g fill="#c7d2fe"><circle cx="0" cy="0" r="10" fill="#a5b4fc"/><circle cx="-60" cy="-8" r="2"/><circle cx="60" cy="8" r="2"/><circle cx="-30" cy="10" r="2"/><circle cx="40" cy="-10" r="2"/><circle cx="-80" cy="4" r="2"/><circle cx="80" cy="-4" r="2"/></g>
    <text x="0" y="56" fill="#a5b4fc" font-size="11" text-anchor="middle">은하 (별 수천억 개)</text>
  </g>
  <!-- 우주 -->
  <g transform="translate(370,220)" fill="#475569"><circle cx="-30" cy="-20" r="3"/><circle cx="20" cy="0" r="3"/><circle cx="50" cy="-26" r="3"/><circle cx="-10" cy="30" r="3"/><circle cx="40" cy="36" r="3"/><circle cx="70" cy="14" r="3"/></g>
  <text x="370" y="276" fill="#94a3b8" font-size="11" text-anchor="middle">은하가 모여 우주</text>
</svg>
