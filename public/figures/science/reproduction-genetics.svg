<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">세포 분열·생식·유전</text>
  <!-- 세포분열 -->
  <g text-anchor="middle">
    <circle cx="70" cy="110" r="26" fill="#13203a" stroke="#34d399"/><g stroke="#f472b6" stroke-width="3"><line x1="62" y1="100" x2="62" y2="120"/><line x1="78" y1="100" x2="78" y2="120"/></g>
    <text x="130" y="114" fill="#fbbf24" font-size="18">→</text>
    <circle cx="186" cy="98" r="18" fill="#13203a" stroke="#34d399"/><circle cx="186" cy="128" r="18" fill="#13203a" stroke="#34d399"/>
    <text x="128" y="162" fill="#6ee7b7" font-size="10">세포 분열 (염색체 복제 후 나뉨)</text>
  </g>
  <!-- 생식·발생 -->
  <g transform="translate(280,86)" text-anchor="middle">
    <circle cx="20" cy="20" r="10" fill="#fca5a5"/><text x="20" y="-2" fill="#fca5a5" font-size="9">난자</text>
    <circle cx="60" cy="20" r="6" fill="#93c5fd"/><text x="78" y="22" fill="#93c5fd" font-size="9">정자</text>
    <text x="100" y="24" fill="#fbbf24" font-size="14">→</text>
    <circle cx="140" cy="20" r="12" fill="#a78bfa"/><text x="140" y="48" fill="#c4b5fd" font-size="9">수정란→발생</text>
  </g>
  <!-- 유전 -->
  <g transform="translate(0,210)" text-anchor="middle">
    <text x="120" y="0" fill="#cbd5e1" font-size="11">부모 형질 → 유전자(염색체) → 자손</text>
    <circle cx="60" cy="34" r="14" fill="#22c55e"/><circle cx="180" cy="34" r="14" fill="#eab308"/>
    <text x="120" y="38" fill="#fbbf24" font-size="14">+</text>
    <circle cx="320" cy="34" r="14" fill="#84cc16"/>
    <text x="240" y="38" fill="#fbbf24" font-size="14">→</text>
    <text x="60" y="62" fill="#94a3b8" font-size="9">부</text><text x="180" y="62" fill="#94a3b8" font-size="9">모</text><text x="320" y="62" fill="#94a3b8" font-size="9">자손(섞임)</text>
  </g>
  <text x="240" y="300" fill="#94a3b8" font-size="10.5" text-anchor="middle">멘델: 완두콩 실험으로 유전 규칙 발견</text>
</svg>
