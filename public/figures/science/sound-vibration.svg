<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">소리는 떨림(진동)으로 전달돼요</text>
  <!-- 소리굽쇠 -->
  <g>
    <rect x="70" y="150" width="14" height="80" fill="#94a3b8"/>
    <rect x="56" y="100" width="12" height="60" rx="4" fill="#cbd5e1"/>
    <rect x="86" y="100" width="12" height="60" rx="4" fill="#cbd5e1"/>
    <g stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.8"><path d="M48 130 q-10 -10 0 -20"/><path d="M106 130 q10 -10 0 -20"/></g>
    <text x="77" y="252" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">진동</text>
  </g>
  <!-- 음파 -->
  <g stroke="#38bdf8" fill="none" stroke-width="2.5">
    <path d="M120 165 q18 -28 36 0 t36 0 t36 0 t36 0 t36 0"/>
    <path d="M120 165 q18 28 36 0 t36 0 t36 0 t36 0 t36 0" opacity="0.5"/>
  </g>
  <text x="240" y="120" fill="#7dd3fc" font-size="12" text-anchor="middle">공기를 타고 퍼지는 소리(음파)</text>
  <!-- 귀 -->
  <g transform="translate(396,150)">
    <path d="M0 0 c-26 -2 -40 22 -34 44 c4 16 22 18 24 30 c2 10 -6 14 -2 20" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="-10" cy="26" r="7" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <text x="-14" y="104" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">귀</text>
  </g>
  <text x="240" y="288" fill="#94a3b8" font-size="11" text-anchor="middle">크게 떨리면 큰 소리, 빠르게 떨리면 높은 소리가 난다</text>
</svg>
