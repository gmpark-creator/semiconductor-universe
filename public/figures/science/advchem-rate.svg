<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">반응 속도</text>
  <!-- 활성화 에너지 언덕 + 촉매 경로 -->
  <g transform="translate(50,70)">
    <line x1="0" y1="150" x2="220" y2="150" stroke="#475569"/><line x1="0" y1="10" x2="0" y2="150" stroke="#475569"/>
    <text x="-6" y="16" fill="#94a3b8" font-size="9" text-anchor="end">에너지</text><text x="110" y="168" fill="#94a3b8" font-size="9" text-anchor="middle">반응 진행 →</text>
    <path d="M10 110 C50 110 60 30 100 30 C140 30 150 120 210 120" fill="none" stroke="#f59e0b" stroke-width="2.4"/>
    <path d="M10 110 C50 110 62 70 100 70 C140 70 150 120 210 120" fill="none" stroke="#34d399" stroke-width="2.2" stroke-dasharray="5 3"/>
    <text x="100" y="24" fill="#fdba74" font-size="8.5" text-anchor="middle">활성화E</text>
    <text x="120" y="64" fill="#6ee7b7" font-size="8.5">촉매 경로(낮음)</text>
  </g>
  <g transform="translate(295,82)">
    <text x="0" y="0" fill="#cbd5e1" font-size="10.5" font-weight="700">충돌 이론</text>
    <text x="0" y="18" fill="#94a3b8" font-size="9">충분한 에너지+알맞은 방향 = 유효 충돌</text>
    <text x="0" y="42" fill="#cbd5e1" font-size="10.5" font-weight="700">속도를 높이는 요인</text>
    <text x="0" y="60" fill="#fbbf24" font-size="9">농도·압력↑, 표면적↑</text>
    <text x="0" y="76" fill="#fbbf24" font-size="9">온도↑(문턱 넘는 입자 늘어남)</text>
    <text x="0" y="92" fill="#6ee7b7" font-size="9">촉매: 활성화E↓ (소모 안 됨)</text>
  </g>
  <text x="240" y="260" fill="#cbd5e1" font-size="10.5" text-anchor="middle">촉매는 속도만 바꾸고 반응열·평형은 바꾸지 않는다</text>
  <text x="240" y="284" fill="#94a3b8" font-size="10" text-anchor="middle">우리 몸의 효소도 생체 촉매 · 배기가스 정화 장치도 촉매</text>
</svg>
