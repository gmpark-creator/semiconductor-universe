<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">자기장과 전자기 유도</text>
  <!-- 전류→자기장 -->
  <g transform="translate(40,70)">
    <text x="100" y="0" fill="#cbd5e1" font-size="11" text-anchor="middle">전류 → 자기장 (전자석)</text>
    <rect x="40" y="40" width="120" height="18" rx="4" fill="#94a3b8"/>
    <path d="M48 40 q8 -16 16 0 q8 16 16 0 q8 -16 16 0 q8 16 16 0 q8 -16 16 0 q8 16 16 0" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="34" y="54" fill="#ef4444" font-size="12" font-weight="800">N</text><text x="166" y="54" fill="#3b82f6" font-size="12" font-weight="800">S</text>
  </g>
  <!-- 유도: 자석 움직임→전류 -->
  <g transform="translate(270,70)">
    <text x="100" y="0" fill="#cbd5e1" font-size="11" text-anchor="middle">자석 움직임 → 유도 전류</text>
    <rect x="20" y="34" width="40" height="20" fill="#ef4444"/><rect x="60" y="34" width="40" height="20" fill="#3b82f6"/>
    <line x1="104" y1="44" x2="140" y2="44" stroke="#fde047" stroke-width="3" marker-end="url(#em)"/>
    <g fill="none" stroke="#fbbf24" stroke-width="2"><ellipse cx="160" cy="44" rx="8" ry="20"/><ellipse cx="172" cy="44" rx="8" ry="20"/><ellipse cx="184" cy="44" rx="8" ry="20"/></g>
    <text x="100" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">빨리 움직일수록 큰 전류(패러데이)</text>
  </g>
  <text x="240" y="196" fill="#6ee7b7" font-size="11" text-anchor="middle">렌츠 법칙: 유도 전류는 변화를 방해하는 방향</text>
  <!-- 발전기/변압기 -->
  <g transform="translate(0,214)">
    <text x="130" y="0" fill="#cbd5e1" font-size="11" text-anchor="middle">발전기: 운동E → 전기E(교류)</text>
    <text x="360" y="0" fill="#cbd5e1" font-size="11" text-anchor="middle">변압기: 감은 수 비로 전압 조절</text>
  </g>
  <text x="240" y="296" fill="#94a3b8" font-size="11" text-anchor="middle">무선 충전·인덕션·발전소 터빈이 모두 전자기 유도</text>
  <defs><marker id="em" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#fde047"/></marker></defs>
</svg>
