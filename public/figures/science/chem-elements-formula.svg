<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">원소·화합물과 화학식</text>
  <!-- 원소 -->
  <g text-anchor="middle">
    <circle cx="70" cy="110" r="22" fill="#67e8f9"/><text x="70" y="116" fill="#04121f" font-size="15" font-weight="800">H</text>
    <circle cx="70" cy="170" r="22" fill="#f87171"/><text x="70" y="176" fill="#fff" font-size="15" font-weight="800">O</text>
    <text x="70" y="210" fill="#94a3b8" font-size="11">원소(홑원소)</text>
  </g>
  <text x="150" y="146" fill="#fbbf24" font-size="26" text-anchor="middle">→</text>
  <!-- 화합물 H2O -->
  <g transform="translate(230,140)">
    <circle cx="0" cy="0" r="24" fill="#f87171"/><text x="0" y="6" fill="#fff" font-size="15" font-weight="800" text-anchor="middle">O</text>
    <circle cx="-28" cy="22" r="15" fill="#67e8f9"/><text x="-28" y="27" fill="#04121f" font-size="11" font-weight="800" text-anchor="middle">H</text>
    <circle cx="28" cy="22" r="15" fill="#67e8f9"/><text x="28" y="27" fill="#04121f" font-size="11" font-weight="800" text-anchor="middle">H</text>
    <line x1="-8" y1="14" x2="-20" y2="16" stroke="#cbd5e1" stroke-width="2"/><line x1="8" y1="14" x2="20" y2="16" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="70" fill="#a5f3fc" font-size="22" font-weight="800" text-anchor="middle">H₂O</text>
    <text x="0" y="92" fill="#94a3b8" font-size="11" text-anchor="middle">화합물(화학식)</text>
  </g>
  <!-- 화학량 -->
  <g transform="translate(330,96)">
    <rect x="0" y="0" width="120" height="116" rx="12" fill="#13203a" stroke="#22d3ee"/>
    <text x="60" y="24" fill="#a5f3fc" font-size="12" font-weight="700" text-anchor="middle">화학량</text>
    <text x="60" y="50" fill="#cbd5e1" font-size="11" text-anchor="middle">원자량(¹²C=12)</text>
    <text x="60" y="74" fill="#cbd5e1" font-size="11" text-anchor="middle">분자량 H₂O</text>
    <text x="60" y="94" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">1×2 + 16 = 18</text>
  </g>
  <text x="240" y="258" fill="#94a3b8" font-size="11" text-anchor="middle">아래 첨자 = 원자 개수 · 약 118종 원소가 수천만 물질을 만든다</text>
</svg>
