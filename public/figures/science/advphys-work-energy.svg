<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">일과 에너지</text>
  <!-- 롤러코스터 역학적 에너지 보존 -->
  <g transform="translate(0,0)">
    <path d="M40 110 Q120 70 170 200 Q210 290 260 210 Q300 150 360 250 Q400 300 440 250" fill="none" stroke="#64748b" stroke-width="3"/>
    <circle cx="40" cy="110" r="9" fill="#f59e0b"/>
    <text x="40" y="96" fill="#fdba74" font-size="9" text-anchor="middle">높은 곳</text>
    <text x="40" y="132" fill="#94a3b8" font-size="8" text-anchor="middle">위치E 큼</text>
    <circle cx="170" cy="200" r="9" fill="#34d399"/>
    <text x="170" y="226" fill="#6ee7b7" font-size="9" text-anchor="middle">낮은 곳</text>
    <text x="170" y="240" fill="#94a3b8" font-size="8" text-anchor="middle">운동E 큼</text>
  </g>
  <g transform="translate(300,90)">
    <rect x="0" y="0" width="150" height="86" rx="10" fill="#13203a" stroke="#475569"/>
    <text x="75" y="24" fill="#cbd5e1" font-size="11" text-anchor="middle" font-weight="700">역학적 에너지 보존</text>
    <text x="75" y="46" fill="#fdba74" font-size="10" text-anchor="middle">위치E + 운동E</text>
    <text x="75" y="64" fill="#6ee7b7" font-size="10" text-anchor="middle">= 일정</text>
    <text x="75" y="80" fill="#94a3b8" font-size="8.5" text-anchor="middle">(마찰 없을 때)</text>
  </g>
  <text x="240" y="296" fill="#94a3b8" font-size="11" text-anchor="middle">일 = 힘 × 힘 방향 이동거리 · 알짜일은 운동 에너지 변화와 같다(일·운동에너지 정리)</text>
</svg>
