<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">산성·염기성과 지시약</text>
  <!-- 지시약 스펙트럼 -->
  <defs><linearGradient id="ph" x1="0" x2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="0.5" stop-color="#22c55e"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
  <rect x="40" y="64" width="400" height="20" rx="10" fill="url(#ph)"/>
  <text x="60" y="100" fill="#fca5a5" font-size="11">← 산성</text>
  <text x="240" y="100" fill="#86efac" font-size="11" text-anchor="middle">중성</text>
  <text x="420" y="100" fill="#a5b4fc" font-size="11" text-anchor="end">염기성 →</text>
  <!-- 산성 예 -->
  <g text-anchor="middle">
    <g><path d="M70 130 h44 v54 a6 6 0 0 1 -6 6 h-32 a6 6 0 0 1 -6 -6 z" fill="#7f1d1d" opacity="0.6" stroke="#f87171"/><text x="92" y="210" fill="#fca5a5" font-size="11">식초·사이다</text><text x="92" y="160" fill="#fff" font-size="10">신맛</text></g>
    <g><path d="M150 130 h44 v54 a6 6 0 0 1 -6 6 h-32 a6 6 0 0 1 -6 -6 z" fill="#7f1d1d" opacity="0.5" stroke="#f87171"/><text x="172" y="210" fill="#fca5a5" font-size="10">레몬즙</text></g>
    <!-- 염기성 예 -->
    <g><path d="M286 130 h44 v54 a6 6 0 0 1 -6 6 h-32 a6 6 0 0 1 -6 -6 z" fill="#312e81" opacity="0.6" stroke="#a5b4fc"/><text x="308" y="210" fill="#c7d2fe" font-size="11">비눗물</text><text x="308" y="160" fill="#fff" font-size="10">미끈</text></g>
    <g><path d="M366 130 h44 v54 a6 6 0 0 1 -6 6 h-32 a6 6 0 0 1 -6 -6 z" fill="#312e81" opacity="0.5" stroke="#a5b4fc"/><text x="388" y="210" fill="#c7d2fe" font-size="9">유리세정제</text></g>
  </g>
  <text x="240" y="252" fill="#cbd5e1" font-size="12" text-anchor="middle">지시약은 성질에 따라 색이 변해요 (리트머스·페놀프탈레인·양배추즙)</text>
  <text x="240" y="280" fill="#94a3b8" font-size="11" text-anchor="middle">산성+염기성을 섞으면 성질이 약해짐 = 중화 (생선에 레몬, 속쓰림에 제산제)</text>
</svg>
