<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">뉴턴의 운동 3법칙</text>
  <g text-anchor="middle">
    <!-- 1법칙 -->
    <g><rect x="24" y="66" width="136" height="150" rx="12" fill="#13203a" stroke="#fbbf24"/>
      <text x="92" y="92" fill="#fde68a" font-size="13" font-weight="700">제1법칙</text>
      <text x="92" y="110" fill="#cbd5e1" font-size="11">관성</text>
      <rect x="68" y="130" width="48" height="30" rx="4" fill="#3b82f6"/>
      <text x="92" y="186" fill="#94a3b8" font-size="9">알짜힘=0 →</text>
      <text x="92" y="200" fill="#94a3b8" font-size="9">운동 상태 유지</text></g>
    <!-- 2법칙 -->
    <g><rect x="172" y="66" width="136" height="150" rx="12" fill="#13203a" stroke="#f59e0b"/>
      <text x="240" y="92" fill="#fbbf24" font-size="13" font-weight="700">제2법칙</text>
      <text x="240" y="124" fill="#fde047" font-size="20" font-weight="800">F = ma</text>
      <rect x="206" y="146" width="40" height="26" rx="4" fill="#3b82f6"/>
      <line x1="246" y1="159" x2="290" y2="159" stroke="#ef4444" stroke-width="4" marker-end="url(#nl)"/>
      <text x="240" y="200" fill="#94a3b8" font-size="9">힘↑ 가속도↑ / 질량↑ 가속도↓</text></g>
    <!-- 3법칙 -->
    <g><rect x="320" y="66" width="136" height="150" rx="12" fill="#13203a" stroke="#34d399"/>
      <text x="388" y="92" fill="#6ee7b7" font-size="13" font-weight="700">제3법칙</text>
      <text x="388" y="110" fill="#cbd5e1" font-size="11">작용·반작용</text>
      <circle cx="360" cy="150" r="14" fill="#3b82f6"/><circle cx="416" cy="150" r="14" fill="#a855f7"/>
      <line x1="376" y1="150" x2="356" y2="150" stroke="#ef4444" stroke-width="3" marker-end="url(#nl)"/>
      <line x1="400" y1="150" x2="420" y2="150" stroke="#34d399" stroke-width="3" marker-end="url(#nl)"/>
      <text x="388" y="200" fill="#94a3b8" font-size="9">크기 같고 방향 반대</text></g>
  </g>
  <text x="240" y="252" fill="#94a3b8" font-size="11" text-anchor="middle">로켓: 가스를 뒤로 분사한 반작용으로 앞으로 나아간다</text>
  <defs><marker id="nl" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="context-stroke"/></marker></defs>
</svg>
