<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="sail" x1="0" x2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">성간 기술: 연구 중인 것과 한계</text>
  <text x="24" y="61" fill="#94a3b8" font-size="11">태양계 심우주 기술은 발전 중이지만, 성간 문명 규모는 아직 거대한 공학 과제다.</text>

  <g transform="translate(56 154)">
    <circle cx="0" cy="0" r="24" fill="#2563eb"/>
    <path d="M-10 -18 C0 -28 18 -18 18 -2 C8 10 -8 12 -20 0" fill="#60a5fa" opacity=".85"/>
    <text x="0" y="45" fill="#93c5fd" font-size="11" text-anchor="middle">지구</text>
  </g>
  <path d="M91 154 C150 98 230 100 292 142" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5"/>
  <path d="M96 154 C154 168 218 180 290 164" fill="none" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#arrow)"/>

  <g transform="translate(236 128)">
    <polygon points="0,0 68,25 0,50" fill="url(#sail)" opacity=".85"/>
    <rect x="-32" y="18" width="36" height="14" rx="7" fill="#94a3b8"/>
    <path d="M-50 25 H-32" stroke="#f59e0b" stroke-width="4"/>
    <path d="M-62 18 L-82 10 M-62 25 L-88 25 M-62 32 L-82 40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <text x="18" y="73" fill="#a5f3fc" font-size="11" text-anchor="middle">태양돛·핵추진 후보</text>
  </g>

  <g transform="translate(334 96)">
    <circle cx="64" cy="58" r="36" fill="none" stroke="#818cf8" stroke-width="1.4" stroke-dasharray="5 4"/>
    <circle cx="64" cy="58" r="6" fill="#facc15"/>
    <circle cx="92" cy="58" r="4" fill="#34d399"/>
    <text x="64" y="116" fill="#c4b5fd" font-size="11" text-anchor="middle">다른 별까지</text>
    <text x="64" y="132" fill="#94a3b8" font-size="10" text-anchor="middle">거리·에너지 장벽</text>
  </g>

  <g transform="translate(24 226)">
    <rect width="132" height="48" rx="8" fill="#102a33" stroke="#22d3ee" stroke-opacity=".7"/>
    <text x="14" y="20" fill="#a5f3fc" font-size="10" font-weight="700">현실 가능</text>
    <text x="14" y="37" fill="#cbd5e1" font-size="9.5">태양돛, 핵열추진, 동면 연구</text>
  </g>
  <g transform="translate(174 226)">
    <rect width="132" height="48" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="14" y="20" fill="#e2e8f0" font-size="10" font-weight="700">공학 난제</text>
    <text x="14" y="37" fill="#cbd5e1" font-size="9.5">방사선, 생명유지, 비용</text>
  </g>
  <g transform="translate(324 226)">
    <rect width="132" height="48" rx="8" fill="#3b0f1c" stroke="#fb7185" stroke-opacity=".75"/>
    <text x="14" y="20" fill="#fecdd3" font-size="10" font-weight="700">상상 장치</text>
    <text x="14" y="37" fill="#cbd5e1" font-size="9.5">초광속·완전한 장기 동면</text>
  </g>
