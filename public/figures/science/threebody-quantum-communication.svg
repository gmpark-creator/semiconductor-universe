<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">양자 얽힘: 상관관계 ≠ 초광속 통신</text>
  <text x="24" y="61" fill="#94a3b8" font-size="11">얽힘은 실제 현상이지만, 원하는 메시지를 빛보다 빠르게 보내지는 못한다.</text>

  <g transform="translate(68 120)">
    <circle cx="0" cy="0" r="28" fill="#4c1d95" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#f5d0fe"/>
    <path d="M-18 -3 C-6 -24 6 24 18 3" fill="none" stroke="#f5d0fe" stroke-width="2"/>
    <text x="0" y="52" fill="#d8b4fe" font-size="11" text-anchor="middle">입자 A</text>
  </g>
  <g transform="translate(402 120)">
    <circle cx="0" cy="0" r="28" fill="#083344" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#a5f3fc"/>
    <path d="M-18 3 C-6 24 6 -24 18 -3" fill="none" stroke="#a5f3fc" stroke-width="2"/>
    <text x="0" y="52" fill="#67e8f9" font-size="11" text-anchor="middle">입자 B</text>
  </g>

  <path d="M96 120 C166 64 304 64 374 120" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="240" y="93" fill="#ddd6fe" font-size="12" text-anchor="middle">상관관계</text>
  <path d="M116 151 L364 151" stroke="#ef4444" stroke-width="2.4" stroke-dasharray="8 6"/>
  <path d="M232 139 L248 163 M248 139 L232 163" stroke="#fecaca" stroke-width="3"/>
  <text x="240" y="179" fill="#fecaca" font-size="12" text-anchor="middle">메시지 직접 전송 X</text>

  <g transform="translate(80 214)">
    <rect width="320" height="58" rx="8" fill="#1e293b" stroke="#475569"/>
    <path d="M44 31 H270" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="160" y="24" fill="#fde68a" font-size="11" text-anchor="middle">고전 채널이 있어야 결과 해석 가능</text>
    <text x="160" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">양자 암호·센서·네트워크는 가능, 소폰식 즉시 통신은 상상 장치</text>
  </g>
</svg>
