<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <defs>
    <marker id="arrow-ee-rc-curve-filter" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">RC 시간상수와 필터</text>
  <text x="456" y="38" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="end">τ = RC</text>
  <line x1="245" y1="66" x2="245" y2="252" stroke="#334155" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- 왼쪽: 충전 지수곡선 -->
  <text x="56" y="60" fill="#94a3b8" font-size="12">① 충전 지수곡선</text>
  <line x1="60" y1="250" x2="60" y2="68" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-ee-rc-curve-filter)"/>
  <line x1="60" y1="250" x2="226" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-ee-rc-curve-filter)"/>
  <text x="50" y="64" fill="#cbd5e1" font-size="12">V</text>
  <text x="230" y="254" fill="#cbd5e1" font-size="12">t</text>

  <line x1="60" y1="90" x2="224" y2="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="28" y="93" fill="#cbd5e1" font-size="11">100%</text>

  <line x1="60" y1="149" x2="100" y2="149" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="149" x2="100" y2="250" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="30" y="153" fill="#fcd34d" font-size="11">63%</text>

  <path d="M60,250 L70,215 L80,187 L90,166 L100,149 L110,137 L120,126 L130,119 L140,112 L150,107 L160,103 L170,100 L180,98 L200,94 L220,92" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="149" r="3.5" fill="#f59e0b"/>
  <text x="124" y="162" fill="#fcd34d" font-size="11">1 − e^(−t/τ)</text>

  <line x1="100" y1="250" x2="100" y2="255" stroke="#64748b" stroke-width="1.5"/>
  <line x1="140" y1="250" x2="140" y2="255" stroke="#64748b" stroke-width="1.5"/>
  <line x1="180" y1="250" x2="180" y2="255" stroke="#64748b" stroke-width="1.5"/>
  <text x="97" y="267" fill="#94a3b8" font-size="11">τ</text>
  <text x="134" y="267" fill="#94a3b8" font-size="11">2τ</text>
  <text x="174" y="267" fill="#94a3b8" font-size="11">3τ</text>

  <!-- 오른쪽: 저역통과 필터 응답 -->
  <text x="266" y="60" fill="#94a3b8" font-size="12">② 저역통과 필터 응답</text>
  <line x1="270" y1="250" x2="270" y2="68" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-ee-rc-curve-filter)"/>
  <line x1="270" y1="250" x2="448" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-ee-rc-curve-filter)"/>
  <text x="262" y="62" fill="#cbd5e1" font-size="11">이득(dB)</text>
  <text x="446" y="264" fill="#cbd5e1" font-size="11" text-anchor="end">주파수 f (log)</text>

  <line x1="270" y1="100" x2="446" y2="100" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="248" y="104" fill="#cbd5e1" font-size="11">0dB</text>
  <line x1="270" y1="115" x2="350" y2="115" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="356" y="119" fill="#fcd34d" font-size="11">−3dB</text>
  <line x1="350" y1="250" x2="350" y2="115" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <path d="M272,100 L332,100 C343,100 347,105 350,115 L446,232" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="350" cy="115" r="3.5" fill="#22d3ee"/>
  <text x="284" y="92" fill="#94a3b8" font-size="11">통과대역</text>
  <text x="376" y="176" fill="#94a3b8" font-size="11">−20 dB/dec</text>
  <text x="344" y="265" fill="#22d3ee" font-size="11">fc</text>

  <text x="240" y="300" fill="#94a3b8" font-size="11" text-anchor="middle">τ=RC: 충전은 τ에서 63% 도달, 저역통과 필터는 fc=1/2πRC에서 −3dB로 꺾인다</text>
</svg>
