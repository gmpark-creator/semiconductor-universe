<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">원자·분자와 주기율표</text>
  <!-- 원자 -->
  <g transform="translate(110,150)">
    <ellipse cx="0" cy="0" rx="70" ry="30" fill="none" stroke="#475569"/>
    <ellipse cx="0" cy="0" rx="30" ry="70" fill="none" stroke="#475569"/>
    <circle cx="0" cy="0" r="14" fill="#f87171"/><text x="0" y="4" fill="#fff" font-size="9" text-anchor="middle">핵+</text>
    <circle cx="70" cy="0" r="6" fill="#38bdf8"/><circle cx="0" cy="-70" r="6" fill="#38bdf8"/>
    <text x="84" y="4" fill="#7dd3fc" font-size="9">전자−</text>
    <text x="0" y="98" fill="#cbd5e1" font-size="11" text-anchor="middle">원자 (핵 + 전자)</text>
  </g>
  <!-- 주기율표 -->
  <g transform="translate(230,86)">
    <text x="120" y="-4" fill="#cbd5e1" font-size="11" text-anchor="middle">주기율표 (성질 비슷한 것끼리)</text>
    <g font-size="9" text-anchor="middle">
      <rect x="0" y="6" width="22" height="22" fill="#13203a" stroke="#fb7185"/><text x="11" y="21" fill="#fda4af">H</text>
      <rect x="218" y="6" width="22" height="22" fill="#13203a" stroke="#a5b4fc"/><text x="229" y="21" fill="#c7d2fe">He</text>
      <rect x="0" y="30" width="22" height="22" fill="#13203a" stroke="#fbbf24"/><text x="11" y="45" fill="#fde68a">Li</text>
      <rect x="48" y="30" width="22" height="22" fill="#13203a" stroke="#34d399"/><text x="59" y="45" fill="#6ee7b7">C</text>
      <rect x="120" y="30" width="22" height="22" fill="#13203a" stroke="#34d399"/><text x="131" y="45" fill="#6ee7b7">O</text>
      <rect x="218" y="30" width="22" height="22" fill="#13203a" stroke="#a5b4fc"/><text x="229" y="45" fill="#c7d2fe">Ne</text>
      <rect x="0" y="54" width="22" height="22" fill="#13203a" stroke="#fbbf24"/><text x="11" y="69" fill="#fde68a">Na</text>
      <rect x="170" y="54" width="22" height="22" fill="#13203a" stroke="#67e8f9"/><text x="181" y="69" fill="#a5f3fc">Cl</text>
    </g>
  </g>
  <!-- 이온 -->
  <text x="240" y="226" fill="#cbd5e1" font-size="12" text-anchor="middle">원자가 전자를 잃으면 양이온(+), 얻으면 음이온(−)</text>
  <text x="240" y="252" fill="#94a3b8" font-size="11" text-anchor="middle">원소 = 한 종류 원자 / 분자 = 원자가 결합한 입자(예: H₂O)</text>
  <text x="240" y="278" fill="#64748b" font-size="10" text-anchor="middle">원자는 대부분 텅 빈 공간</text>
</svg>
