<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">전기 회로 — 직렬과 병렬</text>
  <!-- 직렬 -->
  <text x="120" y="74" fill="#cbd5e1" font-size="13" text-anchor="middle">직렬연결</text>
  <rect x="40" y="92" width="160" height="120" rx="8" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <rect x="96" y="84" width="48" height="16" fill="#0f1729"/>
  <g stroke="#1e293b"><line x1="110" y1="84" x2="110" y2="100"/><line x1="130" y1="86" x2="130" y2="98"/></g>
  <text x="120" y="80" fill="#fcd34d" font-size="11" text-anchor="middle">전지</text>
  <circle cx="80" cy="212" r="13" fill="#fde047" stroke="#0f1729"/><circle cx="160" cy="212" r="13" fill="#fde047" stroke="#0f1729"/>
  <text x="120" y="240" fill="#94a3b8" font-size="10.5" text-anchor="middle">하나 꺼지면 다 꺼짐</text>
  <!-- 병렬 -->
  <text x="360" y="74" fill="#cbd5e1" font-size="13" text-anchor="middle">병렬연결</text>
  <rect x="280" y="92" width="160" height="120" rx="8" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <line x1="330" y1="92" x2="330" y2="212" stroke="#38bdf8" stroke-width="3"/>
  <line x1="390" y1="92" x2="390" y2="212" stroke="#38bdf8" stroke-width="3"/>
  <rect x="336" y="84" width="48" height="16" fill="#0f1729"/>
  <text x="360" y="80" fill="#7dd3fc" font-size="11" text-anchor="middle">전지</text>
  <circle cx="330" cy="152" r="13" fill="#fde047" stroke="#0f1729"/><circle cx="390" cy="152" r="13" fill="#fde047" stroke="#0f1729"/>
  <text x="360" y="240" fill="#94a3b8" font-size="10.5" text-anchor="middle">하나 꺼져도 나머지 켜짐</text>
  <text x="240" y="288" fill="#94a3b8" font-size="11" text-anchor="middle">전지·전선·전구를 끊김 없이 이으면 전기가 흘러 불이 켜진다</text>
</svg>
