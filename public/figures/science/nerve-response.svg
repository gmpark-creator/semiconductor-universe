    <g><circle cx="180" cy="120" r="22" fill="#13203a" stroke="#38bdf8"/><text x="180" y="125" font-size="9" fill="#7dd3fc">감각신경</text></g>
    <g><circle cx="290" cy="120" r="28" fill="#13203a" stroke="#a5b4fc"/><text x="290" y="124" font-size="18">🧠</text><text x="290" y="160" fill="#c7d2fe">뇌(판단)</text></g>
