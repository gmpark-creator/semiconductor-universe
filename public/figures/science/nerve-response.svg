  <g stroke="#475569" stroke-width="2" marker-end="url(#n2)">
    <line x1="86" y1="120" x2="156" y2="120"/><line x1="202" y1="120" x2="260" y2="120"/><line x1="318" y1="120" x2="376" y2="120"/>
