  <text x="240" y="200" fill="#f87171" font-size="11" text-anchor="middle">무조건 반사: 뇌 거치지 않고 척수가 바로 명령(빠름)</text>
  <path d="M60 146 q120 60 340 0" fill="none" stroke="#f87171" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#n2)"/>
  <text x="240" y="262" fill="#94a3b8" font-size="11" text-anchor="middle">호르몬은 혈액 타고 느리게·오래 작용 → 신경과 함께 항상성 유지</text>
