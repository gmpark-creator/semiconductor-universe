<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">원자 구조와 오비탈</text>
  <defs>
    <radialGradient id="sorb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="55%" stop-color="#22d3ee" stop-opacity="0.32"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="porb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/><stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- s 오비탈 -->
  <g transform="translate(115,150)">
    <circle cx="0" cy="0" r="55" fill="url(#sorb)"/>
    <circle cx="0" cy="0" r="3" fill="#f8fafc"/>
    <text x="0" y="84" fill="#a5f3fc" font-size="12" text-anchor="middle" font-weight="700">s 오비탈 (구형)</text>
  </g>
  <!-- p 오비탈 -->
  <g transform="translate(300,150)">
    <ellipse cx="0" cy="-32" rx="26" ry="34" fill="url(#porb)"/>
    <ellipse cx="0" cy="32" rx="26" ry="34" fill="url(#porb)"/>
    <circle cx="0" cy="0" r="3" fill="#f8fafc"/>
    <text x="0" y="92" fill="#fdba74" font-size="12" text-anchor="middle" font-weight="700">p 오비탈 (아령)</text>
  </g>
  <text x="240" y="252" fill="#cbd5e1" font-size="11" text-anchor="middle">오비탈 = 전자가 발견될 확률이 높은 영역</text>
  <text x="240" y="274" fill="#f87171" font-size="10.5" text-anchor="middle">전자는 행성처럼 정해진 궤도를 돌지 않는다 — 확률 분포로 기술</text>
  <text x="240" y="298" fill="#94a3b8" font-size="10" text-anchor="middle">쌓음 원리·한 오비탈에 최대 2개 → 전자 배치가 원소의 성질을 결정</text>
</svg>
