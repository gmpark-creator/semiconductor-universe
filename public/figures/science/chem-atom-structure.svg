<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">원자의 구조와 전자 배치</text>
  <!-- 원자 모형 -->
  <g transform="translate(150,170)">
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="#475569"/>
    <ellipse cx="0" cy="0" rx="110" ry="110" fill="none" stroke="#475569"/>
    <!-- 핵 -->
    <circle cx="0" cy="0" r="22" fill="#7f1d1d"/>
    <g fill="#f87171"><circle cx="-7" cy="-5" r="6"/><circle cx="7" cy="-5" r="6"/></g>
    <g fill="#94a3b8"><circle cx="-5" cy="8" r="6"/><circle cx="6" cy="7" r="6"/></g>
    <text x="0" y="-30" fill="#fca5a5" font-size="9" text-anchor="middle">핵(양성자+ 중성자)</text>
    <!-- 전자 -->
    <circle cx="60" cy="0" r="7" fill="#38bdf8"/><circle cx="-60" cy="0" r="7" fill="#38bdf8"/>
    <circle cx="0" cy="-110" r="7" fill="#38bdf8"/><circle cx="95" cy="55" r="7" fill="#38bdf8"/><circle cx="-95" cy="55" r="7" fill="#38bdf8"/>
    <text x="78" y="-2" fill="#7dd3fc" font-size="9">전자(−)</text>
  </g>
  <!-- 라벨 -->
  <g font-size="11" fill="#cbd5e1">
    <text x="300" y="86">양성자 수 = 원자 번호</text>
    <text x="300" y="110" fill="#94a3b8" font-size="10">(원소 종류 결정)</text>
    <text x="300" y="142">양성자 수 = 전자 수</text>
    <text x="300" y="166" fill="#94a3b8" font-size="10">→ 원자는 중성</text>
    <text x="300" y="198">전자껍질: 안쪽부터 2, 8 …</text>
    <text x="300" y="222" fill="#7dd3fc" font-size="10">맨 바깥 = 원자가 전자(결합 관여)</text>
  </g>
  <text x="240" y="296" fill="#94a3b8" font-size="11" text-anchor="middle">원자 모형: 돌턴 → 톰슨 → 러더퍼드 → 보어 → 현대(확률 분포)</text>
</svg>
