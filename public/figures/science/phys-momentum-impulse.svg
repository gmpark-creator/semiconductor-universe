<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">운동량과 충격량</text>
  <text x="130" y="76" fill="#fde047" font-size="16" font-weight="800" text-anchor="middle">p = mv</text>
  <text x="350" y="76" fill="#fde047" font-size="16" font-weight="800" text-anchor="middle">I = Ft = Δp</text>
  <!-- 운동량 보존: 충돌 -->
  <g transform="translate(0,100)">
    <text x="240" y="0" fill="#cbd5e1" font-size="12" text-anchor="middle">운동량 보존 — 충돌 전후 운동량 합 일정</text>
    <!-- 전 -->
    <circle cx="90" cy="40" r="18" fill="#3b82f6"/><line x1="108" y1="40" x2="150" y2="40" stroke="#38bdf8" stroke-width="4" marker-end="url(#mi)"/>
    <circle cx="200" cy="40" r="12" fill="#a855f7"/>
    <text x="150" y="78" fill="#94a3b8" font-size="10" text-anchor="middle">충돌 전</text>
    <text x="240" y="46" fill="#fbbf24" font-size="20" text-anchor="middle">→</text>
    <!-- 후 -->
    <circle cx="320" cy="40" r="18" fill="#3b82f6"/><line x1="338" y1="40" x2="360" y2="40" stroke="#38bdf8" stroke-width="3" marker-end="url(#mi)"/>
    <circle cx="410" cy="40" r="12" fill="#a855f7"/><line x1="422" y1="40" x2="456" y2="40" stroke="#c084fc" stroke-width="3" marker-end="url(#mi)"/>
    <text x="380" y="78" fill="#94a3b8" font-size="10" text-anchor="middle">충돌 후</text>
  </g>
  <text x="240" y="244" fill="#cbd5e1" font-size="12" text-anchor="middle">충돌 시간을 늘리면(에어백·범퍼) 받는 힘이 작아진다</text>
  <text x="240" y="272" fill="#94a3b8" font-size="11" text-anchor="middle">같은 Δp라도 t를 키우면 F가 줄어든다 (I=Ft 일정)</text>
  <defs><marker id="mi" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="context-stroke"/></marker></defs>
</svg>
