<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">수권과 해수의 순환</text>
  <!-- 수권 비율 -->
  <g transform="translate(70,140)">
    <circle cx="0" cy="0" r="56" fill="#1e3a5f"/>
    <path d="M0 0 L0 -56 A56 56 0 1 1 -2 -56 Z" fill="#0ea5e9"/>
    <text x="0" y="2" fill="#fff" font-size="11" text-anchor="middle">해수</text>
    <text x="0" y="16" fill="#fff" font-size="10" text-anchor="middle">97%</text>
    <text x="0" y="86" fill="#94a3b8" font-size="9.5" text-anchor="middle">담수 3%(대부분 빙하)</text>
  </g>
  <!-- 해류 순환 -->
  <g transform="translate(250,90)">
    <rect x="0" y="0" width="200" height="110" rx="8" fill="#0c2433"/>
    <text x="100" y="-6" fill="#cbd5e1" font-size="11" text-anchor="middle">표층 순환 (바람이 끌어)</text>
    <path d="M20 30 q80 -16 160 14 q-30 40 -90 30 q-70 -8 -70 -44z" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#o2)"/>
    <path d="M30 80 q70 18 150 -6" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#o2)"/>
    <text x="60" y="26" fill="#fca5a5" font-size="9">난류(따뜻)</text>
    <text x="120" y="98" fill="#7dd3fc" font-size="9">한류(차가움)</text>
  </g>
  <text x="350" y="226" fill="#94a3b8" font-size="10" text-anchor="middle">대기 대순환(바람)과 연결</text>
  <text x="240" y="268" fill="#cbd5e1" font-size="11.5" text-anchor="middle">해수: 염분·수온이 밀도를 정함. 해류가 저위도 열을 고위도로 운반 → 기후 조절</text>
  <defs><marker id="o2" markerWidth="8" markerHeight="8" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="context-stroke"/></marker></defs>
</svg>
