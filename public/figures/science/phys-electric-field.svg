<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">전기장과 전기 에너지</text>
  <text x="130" y="70" fill="#fde047" font-size="14" font-weight="800" text-anchor="middle">F = k q₁q₂ / r²</text>
  <text x="130" y="88" fill="#94a3b8" font-size="10" text-anchor="middle">쿨롱 법칙</text>
  <!-- 전기력선 -->
  <g transform="translate(110,170)">
    <circle cx="0" cy="0" r="16" fill="#ef4444"/><text x="0" y="5" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">+</text>
    <g stroke="#fbbf24" stroke-width="1.5" fill="none" marker-end="url(#ef)">
      <line x1="16" y1="0" x2="64" y2="0"/><line x1="-16" y1="0" x2="-64" y2="0"/>
      <line x1="11" y1="11" x2="48" y2="48"/><line x1="-11" y1="-11" x2="-48" y2="-48"/>
      <line x1="11" y1="-11" x2="48" y2="-48"/><line x1="-11" y1="11" x2="-48" y2="48"/>
    </g>
    <text x="0" y="78" fill="#cbd5e1" font-size="10" text-anchor="middle">전기력선(전기장)</text>
  </g>
  <!-- 축전기 -->
  <g transform="translate(300,120)">
    <text x="80" y="0" fill="#cbd5e1" font-size="11" text-anchor="middle">축전기 Q = CV</text>
    <rect x="40" y="14" width="10" height="70" fill="#ef4444"/><rect x="110" y="14" width="10" height="70" fill="#3b82f6"/>
    <g fill="#fca5a5" font-size="11"><text x="45" y="10">+++</text></g>
    <g fill="#93c5fd" font-size="11"><text x="106" y="10">−−−</text></g>
    <line x1="50" y1="49" x2="110" y2="49" stroke="#475569" stroke-dasharray="3 3"/>
    <text x="80" y="104" fill="#94a3b8" font-size="9" text-anchor="middle">전하·에너지 저장</text>
  </g>
  <text x="240" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">전위차(전압, V) = 두 지점의 전위 차 · 번개는 큰 전위차의 방전</text>
  <defs><marker id="ef" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#fbbf24"/></marker></defs>
</svg>
