    <circle cx="282" cy="92" r="8" fill="#f59e0b"/><text x="282" y="122" fill="#fde68a" font-size="10">변이·자연선택</text>
    <circle cx="388" cy="92" r="8" fill="#22d3ee"/><text x="388" y="122" fill="#a5f3fc" font-size="10">생물다양성</text>
