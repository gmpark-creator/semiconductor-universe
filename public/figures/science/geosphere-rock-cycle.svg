<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">지구 내부와 암석 순환</text>
  <!-- 지구 내부 -->
  <g transform="translate(110,170)">
    <path d="M-86 0 a86 86 0 0 1 172 0 z" fill="#7f1d1d"/>
    <path d="M-72 0 a72 72 0 0 1 144 0 z" fill="#b45309"/>
    <path d="M-44 0 a44 44 0 0 1 88 0 z" fill="#f59e0b"/>
    <path d="M-20 0 a20 20 0 0 1 40 0 z" fill="#fde68a"/>
    <line x1="-86" y1="0" x2="86" y2="0" stroke="#334155" stroke-width="1.5"/>
  </g>
  <g font-size="10" fill="#e2e8f0">
    <text x="200" y="96">지각 (얇은 암석)</text>
    <text x="200" y="120">맨틀 (부피 대부분)</text>
    <text x="200" y="144">외핵 (액체)</text>
    <text x="200" y="168">내핵 (고체)</text>
  </g>
  <g stroke="#64748b" stroke-width="1"><line x1="110" y1="92" x2="198" y2="92"/><line x1="110" y1="116" x2="198" y2="116"/><line x1="110" y1="140" x2="198" y2="140"/><line x1="110" y1="162" x2="198" y2="162"/></g>
  <!-- 암석 순환 -->
  <g transform="translate(350,150)" text-anchor="middle" font-size="10.5">
    <text x="0" y="-78" fill="#fbbf24" font-weight="700">암석 순환</text>
    <g fill="#cbd5e1"><text x="0" y="-44">화성암</text><text x="62" y="14">퇴적암</text><text x="-62" y="14">변성암</text><text x="0" y="56">마그마</text></g>
    <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#r2)">
      <path d="M16 -50 q44 18 44 50"/><path d="M52 26 q-52 22 -104 0"/><path d="M-60 6 q-14 -34 48 -56"/>
    </g>
  </g>
  <text x="240" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">판의 경계에서 큰 힘 → 지진·화산 (판 구조론)</text>
  <defs><marker id="r2" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#94a3b8"/></marker></defs>
</svg>
