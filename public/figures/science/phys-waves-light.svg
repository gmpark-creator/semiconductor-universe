<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">파동과 빛 (v = fλ)</text>
  <!-- 파동 -->
  <g transform="translate(40,60)">
    <path d="M0 40 q20 -30 40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="20" y1="40" x2="20" y2="14" stroke="#34d399"/><text x="26" y="22" fill="#6ee7b7" font-size="9">진폭</text>
    <path d="M20 60 H100" stroke="#fbbf24"/><text x="60" y="74" fill="#fde68a" font-size="9" text-anchor="middle">파장 λ</text>
  </g>
  <!-- 전자기파 스펙트럼 -->
  <g transform="translate(40,150)">
    <text x="0" y="-4" fill="#cbd5e1" font-size="11">전자기파 스펙트럼 (파장 김 → 짧음)</text>
    <defs><linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#7f1d1d"/><stop offset="0.45" stop-color="#22c55e"/><stop offset="0.55" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
    <rect x="0" y="6" width="400" height="22" rx="6" fill="url(#spec)"/>
    <g font-size="9" fill="#cbd5e1"><text x="6" y="46">전파</text><text x="90" y="46">적외선</text><text x="180" y="46">가시광선</text><text x="280" y="46">자외선·X선</text><text x="372" y="46">감마선</text></g>
    <text x="200" y="64" fill="#94a3b8" font-size="9" text-anchor="middle">파장 짧을수록 진동수↑ 에너지↑</text>
  </g>
  <text x="240" y="252" fill="#cbd5e1" font-size="12" text-anchor="middle">빛은 횡파·매질 불필요 / 소리는 종파·매질 필요</text>
  <text x="240" y="280" fill="#94a3b8" font-size="11" text-anchor="middle">이중 슬릿의 간섭·회절무늬 = 빛의 파동성 증거</text>
</svg>
