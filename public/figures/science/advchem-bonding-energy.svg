<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">화학 결합과 결합 에너지</text>
  <!-- 에너지 vs 거리 곡선 -->
  <g transform="translate(50,70)">
    <line x1="0" y1="60" x2="200" y2="60" stroke="#475569"/><line x1="0" y1="10" x2="0" y2="150" stroke="#475569"/>
    <text x="-6" y="16" fill="#94a3b8" font-size="9" text-anchor="end">에너지</text><text x="202" y="74" fill="#94a3b8" font-size="9">거리</text>
    <path d="M14 20 C30 120 60 150 80 130 C110 100 160 62 200 60" fill="none" stroke="#f59e0b" stroke-width="2.6"/>
    <line x1="80" y1="130" x2="80" y2="60" stroke="#34d399" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="80" cy="130" r="4" fill="#34d399"/>
    <text x="80" y="148" fill="#6ee7b7" font-size="8.5" text-anchor="middle">가장 안정</text>
    <text x="110" y="100" fill="#a7f3d0" font-size="8.5">결합 에너지</text>
  </g>
  <g transform="translate(280,82)">
    <text x="0" y="0" fill="#cbd5e1" font-size="10.5" font-weight="700">결합은 에너지가 낮아질 때 형성</text>
    <text x="0" y="24" fill="#fbbf24" font-size="9.5">이온 결합: 전자 이동(금속+비금속)</text>
    <text x="0" y="42" fill="#22d3ee" font-size="9.5">공유 결합: 전자쌍 공유(비금속끼리)</text>
    <text x="0" y="60" fill="#a5b4fc" font-size="9.5">금속 결합: 자유 전자가 묶음</text>
    <text x="0" y="86" fill="#94a3b8" font-size="9">결합 에너지 클수록 강하고 짧다</text>
  </g>
  <text x="240" y="252" fill="#cbd5e1" font-size="10.5" text-anchor="middle">반응 = 결합 끊기(흡수) + 새 결합 만들기(방출)</text>
  <text x="240" y="276" fill="#94a3b8" font-size="10" text-anchor="middle">방출 &gt; 흡수 → 발열 반응 · 분자 모양은 전자쌍 반발로 결정</text>
  <text x="240" y="300" fill="#94a3b8" font-size="10" text-anchor="middle">물이 굽은 모양인 것은 산소의 비공유 전자쌍 때문</text>
</svg>
