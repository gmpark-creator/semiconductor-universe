<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#070b18"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">태양계의 행성</text>
  <g fill="#475569"><circle cx="60" cy="90" r="1.5"/><circle cx="200" cy="60" r="1.5"/><circle cx="420" cy="100" r="1.5"/><circle cx="350" cy="50" r="1.5"/><circle cx="120" cy="50" r="1.5"/></g>
  <!-- 태양 -->
  <circle cx="40" cy="180" r="46" fill="#f59e0b"/>
  <circle cx="40" cy="180" r="46" fill="url(#sun)"/>
  <text x="40" y="248" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">태양</text>
  <!-- 행성들 -->
  <g text-anchor="middle" font-size="10.5" fill="#cbd5e1">
    <circle cx="120" cy="180" r="6" fill="#9ca3af"/><text x="120" y="206">수성</text>
    <circle cx="160" cy="180" r="9" fill="#fcd34d"/><text x="160" y="208">금성</text>
    <circle cx="206" cy="180" r="10" fill="#38bdf8"/><text x="206" y="210">지구</text>
    <circle cx="250" cy="180" r="8" fill="#f87171"/><text x="250" y="206">화성</text>
    <circle cx="312" cy="180" r="22" fill="#fbbf24"/><text x="312" y="222">목성</text>
    <circle cx="382" cy="180" r="18" fill="#fcd34d"/><ellipse cx="382" cy="180" rx="30" ry="8" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><text x="382" y="220">토성</text>
    <circle cx="430" cy="180" r="12" fill="#67e8f9"/><text x="430" y="208">천왕성</text>
    <circle cx="462" cy="180" r="11" fill="#60a5fa"/><text x="462" y="208">해왕성</text>
  </g>
  <text x="240" y="296" fill="#94a3b8" font-size="11" text-anchor="middle">태양에서 가까운 순서: 수성·금성·지구·화성·목성·토성·천왕성·해왕성</text>
  <defs><radialGradient id="sun"><stop offset="60%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fde68a"/></radialGradient></defs>
</svg>
