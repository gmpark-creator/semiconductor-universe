<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="gene-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <rect x="20" y="20" width="440" height="280" rx="14" fill="#0b1f1a" stroke="#1f3f35"/>
  <text x="30" y="44" fill="#e2e8f0" font-size="19" font-weight="700">생명의 연속성과 다양성</text>
  <text x="30" y="66" fill="#94a3b8" font-size="11">DNA 정보가 세대를 이어가고, 다양성은 진화의 재료가 된다</text>

  <g transform="translate(42 92)">
    <rect x="0" y="0" width="120" height="84" rx="14" fill="#102a24" stroke="#34d399"/>
    <text x="60" y="20" fill="#bbf7d0" font-size="12" font-weight="700" text-anchor="middle">DNA와 유전자</text>
    <path d="M38 34 C62 46 58 60 82 72" fill="none" stroke="#a7f3d0" stroke-width="3"/>
    <path d="M82 34 C58 46 62 60 38 72" fill="none" stroke="#86efac" stroke-width="3"/>
    <g stroke="#d1fae5" stroke-width="1">
      <line x1="44" y1="39" x2="76" y2="39"/>
      <line x1="46" y1="50" x2="74" y2="50"/>
      <line x1="46" y1="61" x2="74" y2="61"/>
      <line x1="44" y1="70" x2="76" y2="70"/>
    </g>
  </g>

  <g transform="translate(184 92)">
    <rect x="0" y="0" width="120" height="84" rx="14" fill="#13203a" stroke="#60a5fa"/>
    <text x="60" y="20" fill="#bfdbfe" font-size="12" font-weight="700" text-anchor="middle">감수분열</text>
    <circle cx="34" cy="52" r="18" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <path d="M26 42 L42 62 M42 42 L26 62" stroke="#fca5a5" stroke-width="2"/>
    <path d="M52 52 H72" stroke="#60a5fa" stroke-width="2" marker-end="url(#gene-arrow)"/>
    <circle cx="88" cy="43" r="9" fill="#93c5fd"/>
    <circle cx="88" cy="63" r="9" fill="#fca5a5"/>
    <text x="60" y="76" fill="#94a3b8" font-size="9" text-anchor="middle">염색체 수 절반·조합 다양화</text>
  </g>

  <g transform="translate(326 92)">
    <rect x="0" y="0" width="112" height="84" rx="14" fill="#2a1f12" stroke="#f59e0b"/>
    <text x="56" y="20" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">표현형</text>
    <circle cx="38" cy="52" r="16" fill="#34d399"/>
    <circle cx="74" cy="52" r="16" fill="#fbbf24"/>
    <text x="56" y="76" fill="#94a3b8" font-size="9" text-anchor="middle">유전자형 + 환경</text>
  </g>

  <g stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#gene-arrow)">
    <path d="M166 134 H180"/>
    <path d="M308 134 H322"/>
  </g>

  <g transform="translate(74 216)">
    <path d="M0 44 C42 28 64 12 86 0" stroke="#a7f3d0" stroke-width="3" fill="none"/>
    <path d="M86 0 C110 20 128 34 168 44" stroke="#a7f3d0" stroke-width="3" fill="none"/>
    <path d="M86 0 C88 30 92 46 108 66" stroke="#a7f3d0" stroke-width="3" fill="none"/>
    <circle cx="0" cy="44" r="6" fill="#34d399"/>
    <circle cx="168" cy="44" r="6" fill="#f59e0b"/>
    <circle cx="108" cy="66" r="6" fill="#60a5fa"/>
    <text x="84" y="90" fill="#bbf7d0" font-size="11" font-weight="700" text-anchor="middle">계통수</text>
  </g>

  <g transform="translate(280 210)">
    <rect x="0" y="0" width="132" height="68" rx="12" fill="#102a24" stroke="#34d399"/>
    <text x="66" y="20" fill="#bbf7d0" font-size="12" font-weight="700" text-anchor="middle">진화</text>
    <text x="66" y="40" fill="#cbd5e1" font-size="10" text-anchor="middle">변이 + 자연선택</text>
    <text x="66" y="56" fill="#94a3b8" font-size="9" text-anchor="middle">집단 유전자 빈도 변화</text>
  </g>
  <text x="240" y="292" fill="#94a3b8" font-size="10" text-anchor="middle">세대 전달의 정확성과 변이의 다양성이 함께 있어 생명은 이어지고 변화한다</text>
</svg>
