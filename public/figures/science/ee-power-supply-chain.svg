<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <defs>
    <marker id="arrow-ee-power-supply-chain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">전원 회로 사슬</text>

  <!-- ===== 파형 패널 (각 단계 출력 신호) ===== -->
  <!-- WF1 사인파 -->
  <rect x="34" y="58" width="84" height="38" rx="6" fill="#0b1120" stroke="#26324a"/>
  <line x1="40" y1="77" x2="112" y2="77" stroke="#475569" stroke-width="0.8" stroke-dasharray="2 3"/>
  <path d="M40,77 Q46,64 52,77 Q58,90 64,77 Q70,64 76,77 Q82,90 88,77 Q94,64 100,77 Q106,90 112,77" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <text x="76" y="108" fill="#94a3b8" font-size="10" text-anchor="middle">사인파 AC</text>

  <!-- WF2 맥류 -->
  <rect x="142" y="58" width="84" height="38" rx="6" fill="#0b1120" stroke="#26324a"/>
  <line x1="148" y1="88" x2="220" y2="88" stroke="#475569" stroke-width="0.8" stroke-dasharray="2 3"/>
  <path d="M148,88 Q154,66 160,88 Q166,66 172,88 Q178,66 184,88 Q190,66 196,88 Q202,66 208,88 Q214,66 220,88" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="184" y="108" fill="#94a3b8" font-size="10" text-anchor="middle">맥류(정류)</text>

  <!-- WF3 리플 DC -->
  <rect x="250" y="58" width="84" height="38" rx="6" fill="#0b1120" stroke="#26324a"/>
  <line x1="256" y1="88" x2="330" y2="88" stroke="#475569" stroke-width="0.8" stroke-dasharray="2 3"/>
  <path d="M256,76 L260,66 L270,76 L274,66 L284,76 L288,66 L298,76 L302,66 L312,76 L316,66 L326,76 L330,66" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="292" y="108" fill="#94a3b8" font-size="10" text-anchor="middle">리플 DC</text>

  <!-- WF4 안정 DC -->
  <rect x="358" y="58" width="84" height="38" rx="6" fill="#0b1120" stroke="#26324a"/>
  <line x1="364" y1="88" x2="436" y2="88" stroke="#475569" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="364" y1="68" x2="436" y2="68" stroke="#34d399" stroke-width="2.5"/>
  <text x="400" y="108" fill="#94a3b8" font-size="10" text-anchor="middle">안정 DC</text>

  <!-- 파형 → 블록 대응 점선 -->
  <line x1="76"  y1="96" x2="76"  y2="120" stroke="#475569" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="184" y1="96" x2="184" y2="120" stroke="#475569" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="292" y1="96" x2="292" y2="120" stroke="#475569" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="400" y1="96" x2="400" y2="120" stroke="#475569" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== 블록 패널 ===== -->
  <rect x="30"  y="120" width="92" height="96" rx="10" fill="#16223c" stroke="#33415c"/>
  <rect x="138" y="120" width="92" height="96" rx="10" fill="#16223c" stroke="#33415c"/>
  <rect x="246" y="120" width="92" height="96" rx="10" fill="#16223c" stroke="#33415c"/>
  <rect x="354" y="120" width="92" height="96" rx="10" fill="#16223c" stroke="#33415c"/>

  <!-- 단계 번호 -->
  <circle cx="43"  cy="134" r="8" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="43"  y="138" fill="#fbbf24" font-size="10" text-anchor="middle">1</text>
  <circle cx="151" cy="134" r="8" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="151" y="138" fill="#fbbf24" font-size="10" text-anchor="middle">2</text>
  <circle cx="259" cy="134" r="8" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="259" y="138" fill="#fbbf24" font-size="10" text-anchor="middle">3</text>
  <circle cx="367" cy="134" r="8" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="367" y="138" fill="#fbbf24" font-size="10" text-anchor="middle">4</text>

  <!-- 1) 교류 입력: AC 소스 -->
  <line x1="48" y1="160" x2="60" y2="160" stroke="#64748b" stroke-width="1.4"/>
  <line x1="92" y1="160" x2="104" y2="160" stroke="#64748b" stroke-width="1.4"/>
  <circle cx="76" cy="160" r="16" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M67,160 Q71.5,153 76,160 Q80.5,167 85,160" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="76" y="188" fill="#22d3ee" font-size="9" text-anchor="middle">≈ 230 V</text>
  <text x="76" y="207" fill="#cbd5e1" font-size="11" text-anchor="middle">교류 입력</text>

  <!-- 2) 브리지 정류: 다이오드 4개 -->
  <polygon points="184,138 206,160 184,182 162,160" fill="none" stroke="#475569" stroke-width="1.2"/>
  <g transform="translate(173,149) rotate(-45)">
    <path d="M-5,-5 L-5,5 L4,0 Z" fill="#f59e0b"/>
    <line x1="4" y1="-5" x2="4" y2="5" stroke="#fcd34d" stroke-width="2"/>
  </g>
  <g transform="translate(195,149) rotate(-135)">
    <path d="M-5,-5 L-5,5 L4,0 Z" fill="#f59e0b"/>
    <line x1="4" y1="-5" x2="4" y2="5" stroke="#fcd34d" stroke-width="2"/>
  </g>
  <g transform="translate(173,171) rotate(-135)">
    <path d="M-5,-5 L-5,5 L4,0 Z" fill="#f59e0b"/>
    <line x1="4" y1="-5" x2="4" y2="5" stroke="#fcd34d" stroke-width="2"/>
  </g>
  <g transform="translate(195,171) rotate(-45)">
    <path d="M-5,-5 L-5,5 L4,0 Z" fill="#f59e0b"/>
    <line x1="4" y1="-5" x2="4" y2="5" stroke="#fcd34d" stroke-width="2"/>
  </g>
  <text x="211" y="143" fill="#f87171" font-size="12" text-anchor="middle">+</text>
  <text x="157" y="182" fill="#60a5fa" font-size="13" text-anchor="middle">−</text>
  <text x="184" y="207" fill="#cbd5e1" font-size="11" text-anchor="middle">브리지 정류</text>

  <!-- 3) 평활 콘덴서 -->
  <line x1="292" y1="140" x2="292" y2="150" stroke="#64748b" stroke-width="1.4"/>
  <line x1="278" y1="150" x2="306" y2="150" stroke="#fbbf24" stroke-width="2.6"/>
  <line x1="281" y1="158" x2="303" y2="158" stroke="#fbbf24" stroke-width="2.6"/>
  <line x1="292" y1="158" x2="292" y2="176" stroke="#64748b" stroke-width="1.4"/>
  <line x1="282" y1="176" x2="302" y2="176" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="286" y1="180" x2="298" y2="180" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="289" y1="184" x2="295" y2="184" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="272" y="149" fill="#f87171" font-size="11" text-anchor="middle">+</text>
  <text x="292" y="207" fill="#cbd5e1" font-size="11" text-anchor="middle">평활 콘덴서</text>

  <!-- 4) 레귤레이터 -->
  <line x1="366" y1="159" x2="378" y2="159" stroke="#64748b" stroke-width="1.4"/>
  <line x1="422" y1="159" x2="434" y2="159" stroke="#64748b" stroke-width="1.4"/>
  <rect x="378" y="146" width="44" height="26" rx="5" fill="#12243a" stroke="#34d399" stroke-width="1.4"/>
  <text x="400" y="164" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">REG</text>
  <line x1="400" y1="172" x2="400" y2="180" stroke="#64748b" stroke-width="1.4"/>
  <line x1="392" y1="180" x2="408" y2="180" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="395" y1="184" x2="405" y2="184" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="400" y="207" fill="#cbd5e1" font-size="11" text-anchor="middle">레귤레이터</text>

  <!-- ===== 단계 연결 화살표 ===== -->
  <line x1="124" y1="159" x2="135" y2="159" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-ee-power-supply-chain)"/>
  <line x1="232" y1="159" x2="243" y2="159" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-ee-power-supply-chain)"/>
  <line x1="340" y1="159" x2="351" y2="159" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-ee-power-supply-chain)"/>

  <text x="240" y="300" fill="#94a3b8" font-size="11" text-anchor="middle">교류를 정류·평활·레귤레이션으로 다듬어 안정된 직류 전원을 만든다</text>
</svg>
