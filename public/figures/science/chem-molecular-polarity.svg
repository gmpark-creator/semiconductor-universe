<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">분자의 구조와 극성</text>
  <text x="240" y="64" fill="#cbd5e1" font-size="12" text-anchor="middle">전기 음성도 차 → 결합의 극성 / 분자 모양 → 분자의 극성</text>
  <!-- CO2 직선형 무극성 -->
  <g transform="translate(110,140)" text-anchor="middle">
    <circle cx="-44" cy="0" r="16" fill="#f87171"/><text x="-44" y="5" fill="#fff" font-size="11" font-weight="800">O</text>
    <circle cx="0" cy="0" r="18" fill="#64748b"/><text x="0" y="5" fill="#fff" font-size="11" font-weight="800">C</text>
    <circle cx="44" cy="0" r="16" fill="#f87171"/><text x="44" y="5" fill="#fff" font-size="11" font-weight="800">O</text>
    <line x1="-28" y1="0" x2="-18" y2="0" stroke="#cbd5e1" stroke-width="2"/><line x1="28" y1="0" x2="18" y2="0" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="44" fill="#a5b4fc" font-size="11">CO₂ 직선형</text>
    <text x="0" y="62" fill="#94a3b8" font-size="10">대칭 → 무극성</text>
  </g>
  <!-- H2O 굽은형 극성 -->
  <g transform="translate(330,130)" text-anchor="middle">
    <circle cx="0" cy="0" r="20" fill="#f87171"/><text x="0" y="5" fill="#fff" font-size="12" font-weight="800">O</text>
    <circle cx="-26" cy="26" r="13" fill="#67e8f9"/><text x="-26" y="31" fill="#04121f" font-size="10" font-weight="800">H</text>
    <circle cx="26" cy="26" r="13" fill="#67e8f9"/><text x="26" y="31" fill="#04121f" font-size="10" font-weight="800">H</text>
    <line x1="-7" y1="13" x2="-18" y2="18" stroke="#cbd5e1" stroke-width="2"/><line x1="7" y1="13" x2="18" y2="18" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="-30" fill="#fca5a5" font-size="9">δ−</text><text x="-30" y="40" fill="#7dd3fc" font-size="9">δ+</text>
    <text x="0" y="60" fill="#fca5a5" font-size="11">H₂O 굽은형(104.5°)</text>
    <text x="0" y="78" fill="#94a3b8" font-size="10">비대칭 → 극성</text>
  </g>
  <text x="240" y="248" fill="#94a3b8" font-size="11" text-anchor="middle">전자쌍 반발로 분자 모양 결정 · 극성 분자는 분자 사이 힘↑ → 끓는점↑</text>
  <text x="240" y="276" fill="#94a3b8" font-size="11" text-anchor="middle">"끼리끼리 잘 녹는다" — 물(극성)과 기름(무극성)은 안 섞임</text>
</svg>
