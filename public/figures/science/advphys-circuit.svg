<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">전류와 전기 회로</text>
  <!-- 직렬 -->
  <g transform="translate(40,80)" stroke="#22d3ee" stroke-width="2.4" fill="none">
    <rect x="0" y="0" width="170" height="70" rx="6"/>
    <rect x="40" y="-9" width="28" height="18" fill="#13203a" stroke="#f59e0b"/><rect x="100" y="-9" width="28" height="18" fill="#13203a" stroke="#f59e0b"/>
  </g>
  <text x="125" y="68" fill="#f59e0b" font-size="10" text-anchor="middle">직렬</text>
  <text x="125" y="170" fill="#cbd5e1" font-size="9" text-anchor="middle">전체 R = R₁+R₂</text>
  <text x="125" y="184" fill="#94a3b8" font-size="8.5" text-anchor="middle">전류 같음, 전압 나뉨</text>
  <!-- 병렬 -->
  <g transform="translate(250,80)" stroke="#34d399" stroke-width="2.4" fill="none">
    <rect x="0" y="0" width="170" height="70" rx="6"/>
    <line x1="60" y1="0" x2="60" y2="70"/><line x1="110" y1="0" x2="110" y2="70"/>
    <rect x="71" y="6" width="28" height="14" fill="#13203a" stroke="#f59e0b"/><rect x="71" y="48" width="28" height="14" fill="#13203a" stroke="#f59e0b"/>
  </g>
  <text x="335" y="68" fill="#f59e0b" font-size="10" text-anchor="middle">병렬</text>
  <text x="335" y="170" fill="#cbd5e1" font-size="9" text-anchor="middle">전체 R &lt; 각 R</text>
  <text x="335" y="184" fill="#94a3b8" font-size="8.5" text-anchor="middle">전압 같음, 전류 나뉨</text>
  <g transform="translate(60,210)">
    <text x="0" y="0" fill="#cbd5e1" font-size="11" font-weight="700">옴 법칙  V = I R</text>
    <text x="0" y="22" fill="#fbbf24" font-size="10">전력 P = V I · 전력량 = P × 시간</text>
    <text x="0" y="44" fill="#94a3b8" font-size="9.5">발열 ∝ I² → 고압 송전으로 전류 줄여 손실↓</text>
  </g>
  <text x="240" y="302" fill="#94a3b8" font-size="11" text-anchor="middle">가정 기구는 병렬 — 같은 220V, 하나 꺼도 나머지 작동</text>
</svg>
