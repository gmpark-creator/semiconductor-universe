<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">산과 염기의 반응</text>
  <!-- pH 척도 -->
  <g transform="translate(40,70)">
    <defs><linearGradient id="ph" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/><stop offset="40%" stop-color="#f59e0b"/><stop offset="50%" stop-color="#22c55e"/><stop offset="60%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient></defs>
    <rect x="0" y="0" width="400" height="28" rx="6" fill="url(#ph)"/>
    <text x="6" y="48" fill="#fca5a5" font-size="10">0 산성</text>
    <text x="190" y="48" fill="#86efac" font-size="10">7 중성</text>
    <text x="356" y="48" fill="#a5b4fc" font-size="10">14 염기성</text>
    <line x1="200" y1="-4" x2="200" y2="32" stroke="#f8fafc" stroke-width="1.4"/>
  </g>
  <g transform="translate(40,140)">
    <text x="0" y="0" fill="#cbd5e1" font-size="10.5" font-weight="700">산: H⁺ 내놓음 / 염기: OH⁻ 내놓음</text>
    <text x="0" y="20" fill="#94a3b8" font-size="9.5">pH 1 작아질수록 H⁺ 농도 10배</text>
    <rect x="0" y="34" width="420" height="40" rx="8" fill="#7f1d1d22" stroke="#f87171"/>
    <text x="12" y="52" fill="#fecaca" font-size="10" font-weight="700">⚠ 안전: 산·염기는 절대 맛보거나 만지지 않는다</text>
    <text x="12" y="68" fill="#fca5a5" font-size="9">리트머스·페놀프탈레인 등 지시약, pH 시험지·측정기로 확인</text>
  </g>
  <g transform="translate(40,232)">
    <text x="0" y="0" fill="#6ee7b7" font-size="10.5" font-weight="700">중화 반응: H⁺ + OH⁻ → 물 (+ 염) · 발열</text>
    <text x="0" y="20" fill="#94a3b8" font-size="9.5">중화점은 지시약 색 변화로 판단 → 중화 적정으로 농도 측정</text>
    <text x="0" y="38" fill="#94a3b8" font-size="9.5">산성화된 호수·토양, 산업 폐수의 액성 조절에 활용</text>
  </g>
  <text x="240" y="306" fill="#94a3b8" font-size="10" text-anchor="middle">맛·촉감이 아니라 색과 측정으로 — 보안경·장갑은 기본 수칙</text>
</svg>
