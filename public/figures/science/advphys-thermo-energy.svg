<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">열과 에너지 전환</text>
  <!-- 열기관 흐름 -->
  <rect x="60" y="70" width="150" height="34" rx="8" fill="#7f1d1d" stroke="#f87171"/><text x="135" y="92" fill="#fecaca" font-size="12" text-anchor="middle" font-weight="700">고온 열원</text>
  <rect x="90" y="150" width="90" height="50" rx="10" fill="#13203a" stroke="#f59e0b" stroke-width="2"/><text x="135" y="180" fill="#fdba74" font-size="13" text-anchor="middle" font-weight="700">열기관</text>
  <rect x="60" y="246" width="150" height="34" rx="8" fill="#1e3a5f" stroke="#60a5fa"/><text x="135" y="268" fill="#bfdbfe" font-size="12" text-anchor="middle" font-weight="700">저온 열원</text>
  <line x1="135" y1="104" x2="135" y2="150" stroke="#f87171" stroke-width="3" marker-end="url(#th)"/><text x="146" y="132" fill="#fca5a5" font-size="10">Q흡수</text>
  <line x1="135" y1="200" x2="135" y2="246" stroke="#60a5fa" stroke-width="3" marker-end="url(#th)"/><text x="146" y="228" fill="#93c5fd" font-size="10">Q방출</text>
  <line x1="180" y1="175" x2="250" y2="175" stroke="#34d399" stroke-width="3" marker-end="url(#th)"/><text x="215" y="166" fill="#6ee7b7" font-size="11">일 W</text>
  <g transform="translate(280,120)">
    <text x="0" y="0" fill="#cbd5e1" font-size="11" font-weight="700">열역학 제1법칙</text>
    <text x="0" y="20" fill="#94a3b8" font-size="9.5">Q = ΔU + W</text>
    <text x="0" y="48" fill="#cbd5e1" font-size="11" font-weight="700">열효율</text>
    <text x="0" y="68" fill="#fbbf24" font-size="9.5">= W / Q흡수 &lt; 1</text>
    <text x="0" y="96" fill="#cbd5e1" font-size="11" font-weight="700">제2법칙</text>
    <text x="0" y="116" fill="#94a3b8" font-size="9">열은 고온→저온, 엔트로피 증가</text>
  </g>
  <text x="240" y="304" fill="#94a3b8" font-size="10.5" text-anchor="middle">받은 열을 전부 일로 바꿀 수 없다 — 반드시 일부를 저온으로 버린다</text>
  <defs><marker id="th" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
</svg>
