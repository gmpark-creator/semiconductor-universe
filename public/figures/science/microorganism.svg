<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">현미경 속 다양한 작은 생물</text>
  <!-- 현미경 시야 -->
  <circle cx="180" cy="180" r="110" fill="#0b1f1a" stroke="#34d399" stroke-width="3"/>
  <clipPath id="lens"><circle cx="180" cy="180" r="108"/></clipPath>
  <g clip-path="url(#lens)">
    <!-- 곰팡이(실 모양) -->
    <g stroke="#a3e635" stroke-width="2" fill="none"><path d="M110 130 q20 20 0 50 q-18 16 6 40"/><path d="M126 120 q24 24 6 60"/></g>
    <circle cx="108" cy="124" r="6" fill="#bef264"/><circle cx="130" cy="116" r="6" fill="#bef264"/>
    <text x="120" y="200" fill="#d9f99d" font-size="10">곰팡이</text>
    <!-- 짚신벌레 -->
    <g transform="translate(210,150)"><ellipse cx="0" cy="0" rx="34" ry="16" fill="#5eead4" opacity="0.85"/><g stroke="#0f766e" stroke-width="1.2"><line x1="-30" y1="-12" x2="-34" y2="-18"/><line x1="-10" y1="-15" x2="-12" y2="-22"/><line x1="14" y1="-14" x2="16" y2="-21"/></g></g>
    <text x="210" y="180" fill="#99f6e4" font-size="10" text-anchor="middle">짚신벌레</text>
    <!-- 세균 -->
    <g fill="#fca5a5"><ellipse cx="150" cy="232" rx="14" ry="7"/><circle cx="200" cy="240" r="7"/><ellipse cx="232" cy="218" rx="12" ry="6"/></g>
    <text x="186" y="262" fill="#fecaca" font-size="10">세균</text>
  </g>
  <!-- 현미경 아이콘 -->
  <g transform="translate(360,120)" stroke="#cbd5e1" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M0 0 l24 30"/><circle cx="0" cy="-6" r="8" fill="#1e293b"/><path d="M-16 80 h60"/><path d="M14 40 v40"/>
  </g>
  <text x="384" y="226" fill="#cbd5e1" font-size="11" text-anchor="middle">현미경</text>
  <text x="240" y="306" fill="#94a3b8" font-size="11" text-anchor="middle">균류·세균·짚신벌레 — 발효(김치·된장)와 분해를 돕기도, 병을 일으키기도</text>
</svg>
