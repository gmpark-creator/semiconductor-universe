<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">열의 이동 세 가지 + 열평형</text>
  <!-- 전도 -->
  <g><text x="86" y="78" fill="#fdba74" font-size="13" font-weight="700" text-anchor="middle">전도 (고체)</text>
    <rect x="30" y="92" width="112" height="16" rx="4" fill="#475569"/>
    <g fill="#fb923c"><circle cx="44" cy="100" r="5"/><circle cx="62" cy="100" r="5" opacity="0.8"/><circle cx="80" cy="100" r="5" opacity="0.6"/><circle cx="98" cy="100" r="5" opacity="0.4"/><circle cx="116" cy="100" r="5" opacity="0.25"/></g>
    <text x="86" y="128" fill="#94a3b8" font-size="9.5" text-anchor="middle">입자→입자 전달</text></g>
  <!-- 대류 -->
  <g><text x="240" y="78" fill="#fdba74" font-size="13" font-weight="700" text-anchor="middle">대류 (액체·기체)</text>
    <rect x="196" y="88" width="88" height="50" rx="6" fill="#1e3a5f"/>
    <g stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#hm)"><path d="M214 132 q-4 -34 22 -40"/><path d="M266 92 q4 34 -22 40"/></g>
    <text x="240" y="156" fill="#94a3b8" font-size="9.5" text-anchor="middle">데워진 것↑ 찬 것↓</text></g>
  <!-- 복사 -->
  <g><text x="396" y="78" fill="#fdba74" font-size="13" font-weight="700" text-anchor="middle">복사 (매질 없이)</text>
    <circle cx="360" cy="112" r="16" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"><line x1="378" y1="108" x2="430" y2="100"/><line x1="378" y1="116" x2="430" y2="124"/></g>
    <rect x="430" y="96" width="14" height="32" fill="#94a3b8"/>
    <text x="396" y="150" fill="#94a3b8" font-size="9.5" text-anchor="middle">빛처럼 직접 전달</text></g>
  <!-- 열평형 -->
  <g transform="translate(0,210)">
    <rect x="120" y="0" width="100" height="44" rx="6" fill="#7f1d1d"/><text x="170" y="28" fill="#fff" font-size="13" text-anchor="middle">뜨거움 80°C</text>
    <rect x="260" y="0" width="100" height="44" rx="6" fill="#1e3a8a"/><text x="310" y="28" fill="#fff" font-size="13" text-anchor="middle">차가움 20°C</text>
    <text x="240" y="28" fill="#fbbf24" font-size="20" text-anchor="middle">→열→</text>
    <text x="240" y="74" fill="#cbd5e1" font-size="12" text-anchor="middle">시간이 지나면 같은 온도(50°C)가 되어 멈춤 = 열평형</text>
  </g>
  <defs><marker id="hm" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#f87171"/></marker></defs>
</svg>
