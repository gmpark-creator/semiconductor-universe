<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <radialGradient id="starA" cx="35%" cy="35%">
      <stop offset="0" stop-color="#fff7ad"/>
      <stop offset="0.45" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <radialGradient id="starB" cx="35%" cy="35%">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </radialGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">삼체계: 가능한 궤도와 혼돈</text>
  <text x="24" y="61" fill="#94a3b8" font-size="11">세 태양 자체는 가능하지만, 장기 생존 가능한 궤도는 매우 까다롭다.</text>

  <g transform="translate(168 166)">
    <ellipse cx="0" cy="0" rx="124" ry="76" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 5"/>
    <ellipse cx="4" cy="2" rx="66" ry="42" fill="none" stroke="#22d3ee" stroke-width="2.2"/>
    <path d="M-92 -50 C-52 -108 62 -104 98 -42 C132 18 62 84 -18 68 C-94 52 -126 2 -92 -50Z" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M-54 -6 C-6 -44 44 -36 76 -4" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M76 -4 C40 42 -20 50 -64 20" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="-58" cy="-8" r="20" fill="url(#starA)"/>
    <circle cx="54" cy="-28" r="16" fill="url(#starB)"/>
    <circle cx="18" cy="52" r="12" fill="#fca5a5"/>
    <circle cx="72" cy="2" r="7" fill="#34d399"/>
    <text x="72" y="22" fill="#a7f3d0" font-size="9" text-anchor="middle">행성</text>
    <text x="0" y="105" fill="#67e8f9" font-size="10" text-anchor="middle">안정 영역은 수치 시뮬레이션으로 판별</text>
  </g>

  <g transform="translate(322 92)">
    <rect width="130" height="64" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-opacity=".65"/>
    <text x="14" y="21" fill="#f5d0fe" font-size="11" font-weight="700">소설 속 상상력</text>
    <text x="14" y="41" fill="#cbd5e1" font-size="10">극단적 계절 재난</text>
    <text x="14" y="56" fill="#cbd5e1" font-size="10">문명 주기의 붕괴</text>
  </g>
  <g transform="translate(322 178)">
    <rect width="130" height="72" rx="8" fill="#102a33" stroke="#22d3ee" stroke-opacity=".75"/>
    <text x="14" y="22" fill="#a5f3fc" font-size="11" font-weight="700">현실 과학</text>
    <text x="14" y="43" fill="#cbd5e1" font-size="10">다중성계와 외계행성</text>
    <text x="14" y="58" fill="#cbd5e1" font-size="10">혼돈·장기 안정성</text>
  </g>
  <text x="240" y="296" fill="#94a3b8" font-size="11" text-anchor="middle">판정: 다중 태양 행성은 가능, 소설식 재난 주기는 고도로 극화된 설정</text>
</svg>
