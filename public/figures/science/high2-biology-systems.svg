<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="bio-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <rect x="20" y="20" width="440" height="280" rx="14" fill="#0b1f1a" stroke="#1f3f35"/>
  <text x="30" y="44" fill="#e2e8f0" font-size="19" font-weight="700">생명 시스템의 구성</text>
  <text x="30" y="66" fill="#94a3b8" font-size="11">세포에서 생태계까지, 물질·에너지·정보가 흐르는 계층적 시스템</text>

  <g text-anchor="middle" font-size="11" font-weight="700">
    <circle cx="70" cy="128" r="34" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <circle cx="60" cy="120" r="8" fill="#a7f3d0"/>
    <circle cx="80" cy="136" r="7" fill="#6ee7b7"/>
    <text x="70" y="184" fill="#bbf7d0">세포</text>

    <rect x="128" y="96" width="70" height="64" rx="12" fill="#12372f" stroke="#34d399" stroke-width="2"/>
    <path d="M144 118 C158 104 172 132 186 116" fill="none" stroke="#a7f3d0" stroke-width="2"/>
    <path d="M144 140 C158 126 172 154 186 138" fill="none" stroke="#a7f3d0" stroke-width="2"/>
    <text x="163" y="184" fill="#bbf7d0">조직·기관</text>

    <rect x="226" y="90" width="82" height="76" rx="16" fill="#14532d" stroke="#86efac" stroke-width="2"/>
    <circle cx="267" cy="115" r="13" fill="#dcfce7"/>
    <path d="M254 150 C260 132 274 132 280 150" fill="none" stroke="#dcfce7" stroke-width="4" stroke-linecap="round"/>
    <text x="267" y="184" fill="#bbf7d0">개체</text>

    <rect x="338" y="88" width="94" height="82" rx="14" fill="#13203a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="364" cy="118" r="9" fill="#86efac"/>
    <circle cx="392" cy="116" r="9" fill="#fde68a"/>
    <circle cx="380" cy="142" r="9" fill="#fca5a5"/>
    <text x="385" y="184" fill="#bae6fd">생태계</text>
  </g>

  <g stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#bio-arrow)">
    <path d="M104 128 H124"/>
    <path d="M198 128 H222"/>
    <path d="M308 128 H334"/>
  </g>

  <g transform="translate(50 222)">
    <rect x="0" y="0" width="118" height="42" rx="10" fill="#102a24" stroke="#34d399"/>
    <text x="59" y="18" fill="#bbf7d0" font-size="11" font-weight="700" text-anchor="middle">물질대사</text>
    <text x="59" y="33" fill="#94a3b8" font-size="9" text-anchor="middle">동화·이화·효소</text>
    <rect x="148" y="0" width="118" height="42" rx="10" fill="#102a24" stroke="#f59e0b"/>
    <text x="207" y="18" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">ATP</text>
    <text x="207" y="33" fill="#94a3b8" font-size="9" text-anchor="middle">세포 활동의 에너지</text>
    <rect x="296" y="0" width="118" height="42" rx="10" fill="#102a24" stroke="#38bdf8"/>
    <text x="355" y="18" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle">상호작용</text>
    <text x="355" y="33" fill="#94a3b8" font-size="9" text-anchor="middle">먹이 관계·환경 저항</text>
  </g>
  <text x="240" y="292" fill="#94a3b8" font-size="10" text-anchor="middle">생명 현상은 구성 단계가 달라도 물질, 에너지, 정보 흐름으로 연결된다</text>
</svg>
