<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">힘의 표현과 평형</text>
  <!-- 힘 화살표 -->
  <rect x="100" y="86" width="60" height="44" rx="6" fill="#3b82f6"/>
  <line x1="160" y1="108" x2="250" y2="108" stroke="#f59e0b" stroke-width="5" marker-end="url(#f1)"/>
  <text x="205" y="98" fill="#fcd34d" font-size="12" text-anchor="middle">힘 (크기·방향)</text>
  <text x="130" y="150" fill="#93c5fd" font-size="11" text-anchor="middle">작용점</text>
  <text x="340" y="108" fill="#cbd5e1" font-size="12">단위: 뉴턴(N)</text>
  <!-- 평형 -->
  <g transform="translate(0,200)">
    <rect x="180" y="0" width="120" height="44" rx="8" fill="#334155"/>
    <text x="240" y="28" fill="#e2e8f0" font-size="13" text-anchor="middle">물체</text>
    <line x1="178" y1="22" x2="96" y2="22" stroke="#f87171" stroke-width="5" marker-end="url(#f1)"/>
    <line x1="302" y1="22" x2="384" y2="22" stroke="#34d399" stroke-width="5" marker-end="url(#f1)"/>
    <text x="240" y="74" fill="#cbd5e1" font-size="12" text-anchor="middle">크기 같고 방향 반대 = 힘의 평형 → 정지 유지</text>
    <text x="240" y="96" fill="#94a3b8" font-size="11" text-anchor="middle">여러 가지 힘: 중력 · 마찰력 · 탄성력</text>
  </g>
  <defs><marker id="f1" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="context-stroke"/></marker></defs>
</svg>
