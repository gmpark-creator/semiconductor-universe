<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">운동량과 충돌</text>
  <!-- 충돌 전 -->
  <g transform="translate(0,90)">
    <text x="40" y="-8" fill="#94a3b8" font-size="11">충돌 전</text>
    <circle cx="70" cy="20" r="22" fill="#22d3ee33" stroke="#22d3ee" stroke-width="2"/><text x="70" y="25" fill="#a5f3fc" font-size="12" text-anchor="middle">m₁</text>
    <line x1="96" y1="20" x2="150" y2="20" stroke="#22d3ee" stroke-width="3" marker-end="url(#mc)"/><text x="123" y="12" fill="#a5f3fc" font-size="9">v₁</text>
    <circle cx="210" cy="20" r="16" fill="#fb718533" stroke="#fb7185" stroke-width="2"/><text x="210" y="24" fill="#fda4af" font-size="11" text-anchor="middle">m₂</text>
  </g>
  <!-- 충돌 후 -->
  <g transform="translate(0,180)">
    <text x="40" y="-8" fill="#94a3b8" font-size="11">충돌 후</text>
    <circle cx="90" cy="20" r="22" fill="#22d3ee33" stroke="#22d3ee" stroke-width="2"/><text x="90" y="25" fill="#a5f3fc" font-size="12" text-anchor="middle">m₁</text>
    <line x1="116" y1="20" x2="150" y2="20" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#mc)"/>
    <circle cx="220" cy="20" r="16" fill="#fb718533" stroke="#fb7185" stroke-width="2"/><text x="220" y="24" fill="#fda4af" font-size="11" text-anchor="middle">m₂</text>
    <line x1="238" y1="20" x2="290" y2="20" stroke="#fb7185" stroke-width="3" marker-end="url(#mc)"/><text x="262" y="12" fill="#fda4af" font-size="9">v₂′</text>
  </g>
  <g transform="translate(300,110)">
    <rect x="0" y="0" width="160" height="96" rx="10" fill="#13203a" stroke="#475569"/>
    <text x="80" y="24" fill="#cbd5e1" font-size="11" text-anchor="middle" font-weight="700">운동량 보존</text>
    <text x="80" y="44" fill="#fbbf24" font-size="10" text-anchor="middle">충돌 전 합 = 충돌 후 합</text>
    <text x="80" y="66" fill="#6ee7b7" font-size="9.5" text-anchor="middle">탄성: 운동E도 보존</text>
    <text x="80" y="84" fill="#f87171" font-size="9.5" text-anchor="middle">비탄성: 운동E 일부 손실</text>
  </g>
  <text x="240" y="298" fill="#94a3b8" font-size="11" text-anchor="middle">충격량 = 힘 × 작용 시간 = 운동량 변화 · 시간을 늘리면 힘이 작아진다(에어백)</text>
  <defs><marker id="mc" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
</svg>
