<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">광합성과 호흡</text>
  <!-- 잎 -->
  <g transform="translate(240,150)">
    <path d="M0 -56 q70 14 70 56 q-70 14 -70 -14 q-70 28 -70 -14 q0 -42 70 -28z" fill="#16a34a"/>
    <path d="M0 -56 v110" stroke="#065f46" stroke-width="2"/>
    <text x="0" y="4" fill="#dcfce7" font-size="11" text-anchor="middle" font-weight="700">잎(엽록체)</text>
  </g>
  <!-- 광합성 입력 -->
  <g font-size="11">
    <text x="60" y="80" fill="#fbbf24">☀️ 빛</text>
    <text x="40" y="160" fill="#7dd3fc">💧 물(뿌리)</text>
    <text x="36" y="210" fill="#94a3b8">CO₂ 이산화탄소</text>
  </g>
  <g stroke="#34d399" stroke-width="2" marker-end="url(#p2)" fill="none">
    <line x1="92" y1="76" x2="180" y2="110"/><line x1="110" y1="156" x2="172" y2="150"/><line x1="120" y1="206" x2="176" y2="178"/>
  </g>
  <!-- 광합성 출력 -->
  <g font-size="11">
    <text x="392" y="120" fill="#86efac">🍚 양분</text>
    <text x="392" y="170" fill="#a5f3fc">O₂ 산소</text>
  </g>
  <g stroke="#fbbf24" stroke-width="2" marker-end="url(#p2)" fill="none">
    <line x1="300" y1="120" x2="384" y2="116"/><line x1="300" y1="150" x2="384" y2="166"/>
  </g>
  <text x="240" y="252" fill="#cbd5e1" font-size="12" text-anchor="middle">광합성: 빛+물+CO₂ → 양분+산소 (낮)</text>
  <text x="240" y="276" fill="#94a3b8" font-size="11" text-anchor="middle">호흡: 양분+산소 → 에너지 (밤낮) · 기공으로 증산작용</text>
  <defs><marker id="p2" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="context-stroke"/></marker></defs>
</svg>
