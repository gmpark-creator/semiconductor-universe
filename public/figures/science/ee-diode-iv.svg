<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <defs>
    <marker id="arrowhead-ee-diode-iv" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arrowgrn-ee-diode-iv" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#34d399"/></marker>
  </defs>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">다이오드 I-V 특성</text>

  <!-- 다이오드 기호 (애노드 → 캐소드) -->
  <line x1="46" y1="150" x2="182" y2="150" stroke="#64748b" stroke-width="3"/>
  <polygon points="96,128 96,172 138,150" fill="#f59e0b"/>
  <line x1="138" y1="126" x2="138" y2="174" stroke="#fbbf24" stroke-width="4"/>
  <line x1="72" y1="130" x2="124" y2="130" stroke="#34d399" stroke-width="2" marker-end="url(#arrowgrn-ee-diode-iv)"/>
  <text x="96" y="122" fill="#34d399" font-size="11" text-anchor="middle">순방향 전류</text>
  <text x="64" y="196" fill="#f87171" font-size="12" text-anchor="middle" font-weight="600">애노드 (+)</text>
  <text x="150" y="196" fill="#60a5fa" font-size="12" text-anchor="middle" font-weight="600">캐소드 (−)</text>
  <text x="112" y="230" fill="#94a3b8" font-size="11" text-anchor="middle">다이오드</text>

  <!-- 기호 → 특성곡선 연결 -->
  <line x1="196" y1="150" x2="252" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowhead-ee-diode-iv)"/>
  <text x="224" y="140" fill="#cbd5e1" font-size="10" text-anchor="middle">특성곡선</text>

  <!-- I-V 그래프 -->
  <line x1="268" y1="180" x2="452" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead-ee-diode-iv)"/>
  <line x1="300" y1="234" x2="300" y2="66" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead-ee-diode-iv)"/>
  <text x="300" y="60" fill="#cbd5e1" font-size="12" text-anchor="middle">전류 (I)</text>
  <text x="426" y="200" fill="#cbd5e1" font-size="12" text-anchor="middle">전압 (V)</text>
  <text x="292" y="196" fill="#94a3b8" font-size="10" text-anchor="end">0</text>

  <!-- 곡선: 역방향 ≈0, 0.7V 넘으면 급상승 -->
  <path d="M270,185 L300,181 L340,178 C350,176 356,150 362,120 C369,92 380,78 396,70" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- 0.7V 임계 표시 -->
  <line x1="340" y1="178" x2="340" y2="122" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="340" cy="178" r="3.2" fill="#fcd34d"/>
  <text x="343" y="196" fill="#f59e0b" font-size="11" text-anchor="middle" font-weight="600">0.7 V</text>

  <text x="404" y="104" fill="#fbbf24" font-size="12" text-anchor="middle" font-weight="600">순방향</text>
  <text x="282" y="216" fill="#60a5fa" font-size="11" text-anchor="middle">역방향(≈0)</text>

  <text x="240" y="300" fill="#94a3b8" font-size="11" text-anchor="middle">순방향 0.7V 이상에서 전류 급증, 역방향은 거의 흐르지 않는다</text>
</svg>
