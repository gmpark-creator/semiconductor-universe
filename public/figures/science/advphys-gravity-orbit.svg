<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">중력장과 천체 운동</text>
  <!-- 타원 궤도 -->
  <g transform="translate(180,170)">
    <ellipse cx="0" cy="0" rx="140" ry="86" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4"/>
    <circle cx="-70" cy="0" r="20" fill="#f59e0b"/><text x="-70" y="5" fill="#1f2937" font-size="10" text-anchor="middle" font-weight="700">태양</text>
    <circle cx="-140" cy="0" r="8" fill="#60a5fa"/><text x="-140" y="-14" fill="#93c5fd" font-size="8" text-anchor="middle">가까움·빠름</text>
    <circle cx="140" cy="0" r="8" fill="#60a5fa"/><text x="140" y="-14" fill="#93c5fd" font-size="8" text-anchor="middle">멀고·느림</text>
    <path d="M-70 0 L-140 0" stroke="#22d3ee" stroke-width="1.2"/><path d="M-70 0 L140 0" stroke="#22d3ee" stroke-width="1.2"/>
    <path d="M-130 0 A140 86 0 0 1 -118 -34 L-70 0 Z" fill="#22d3ee33"/>
    <path d="M118 34 A140 86 0 0 1 130 0 L-70 0 Z" fill="#22d3ee33"/>
  </g>
  <g transform="translate(330,80)">
    <text x="0" y="0" fill="#fbbf24" font-size="10">① 타원 궤도</text>
    <text x="0" y="22" fill="#6ee7b7" font-size="10">② 같은 시간·같은 넓이</text>
    <text x="0" y="44" fill="#a5b4fc" font-size="10">③ T² ∝ a³</text>
    <text x="0" y="74" fill="#cbd5e1" font-size="9.5">만유인력 F ∝ m₁m₂ / r²</text>
    <text x="0" y="92" fill="#94a3b8" font-size="9">(거리 2배 → 힘 1/4)</text>
  </g>
  <text x="240" y="300" fill="#94a3b8" font-size="11" text-anchor="middle">중력이 구심력이 되어 행성·위성이 궤도를 돈다 · 탈출 속도 ≈ 11.2 km/s</text>
</svg>
