<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">여러 가지 기체</text>
  <!-- 산소 -->
  <g><rect x="36" y="70" width="124" height="120" rx="12" fill="#13203a" stroke="#f87171" stroke-width="1.5"/>
    <text x="98" y="100" fill="#fca5a5" font-size="15" font-weight="700" text-anchor="middle">산소</text>
    <text x="98" y="128" font-size="22" text-anchor="middle">🔥</text>
    <text x="98" y="162" fill="#cbd5e1" font-size="10.5" text-anchor="middle">타는 것을 도움</text>
    <text x="98" y="180" fill="#cbd5e1" font-size="10.5" text-anchor="middle">호흡에 필요</text></g>
  <!-- 이산화탄소 -->
  <g><rect x="178" y="70" width="124" height="120" rx="12" fill="#13203a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="240" y="100" fill="#7dd3fc" font-size="15" font-weight="700" text-anchor="middle">이산화 탄소</text>
    <text x="240" y="128" font-size="22" text-anchor="middle">🧯</text>
    <text x="240" y="162" fill="#cbd5e1" font-size="10.5" text-anchor="middle">불을 끔 · 소화기</text>
    <text x="240" y="180" fill="#cbd5e1" font-size="10.5" text-anchor="middle">석회수 뿌옇게</text></g>
  <!-- 질소 -->
  <g><rect x="320" y="70" width="124" height="120" rx="12" fill="#13203a" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="382" y="100" fill="#c7d2fe" font-size="15" font-weight="700" text-anchor="middle">질소</text>
    <text x="382" y="128" font-size="22" text-anchor="middle">🍪</text>
    <text x="382" y="162" fill="#cbd5e1" font-size="10.5" text-anchor="middle">공기의 대부분</text>
    <text x="382" y="180" fill="#cbd5e1" font-size="10.5" text-anchor="middle">과자 봉지 충전</text></g>
  <!-- 피스톤(부피변화) -->
  <g transform="translate(40,214)">
    <rect x="0" y="0" width="160" height="44" rx="6" fill="#1e293b" stroke="#475569"/>
    <rect x="0" y="0" width="96" height="44" rx="6" fill="#334155"/>
    <line x1="96" y1="-8" x2="96" y2="52" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="96" y1="22" x2="150" y2="22" stroke="#f87171" stroke-width="3" marker-end="url(#g1)"/>
  </g>
  <text x="120" y="306" fill="#94a3b8" font-size="11">압력을 가하면(누르면) 기체의 부피가 줄어든다</text>
  <text x="300" y="240" fill="#cbd5e1" font-size="11">온도 ↑ → 부피 ↑</text>
  <text x="300" y="260" fill="#cbd5e1" font-size="11">온도 ↓ → 부피 ↓</text>
  <defs><marker id="g1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#f87171"/></marker></defs>
</svg>
