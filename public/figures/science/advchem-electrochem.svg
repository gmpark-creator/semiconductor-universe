<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">산화·환원과 전기 화학</text>
  <!-- 화학 전지 -->
  <g transform="translate(60,90)">
    <rect x="0" y="40" width="200" height="80" rx="8" fill="#13203a" stroke="#475569"/>
    <rect x="30" y="10" width="14" height="80" fill="#94a3b8"/><text x="37" y="134" fill="#fca5a5" font-size="10" text-anchor="middle">(−) 산화</text>
    <rect x="156" y="10" width="14" height="80" fill="#fbbf24"/><text x="163" y="134" fill="#93c5fd" font-size="10" text-anchor="middle">(+) 환원</text>
    <path d="M37 10 V-10 H163 V10" fill="none" stroke="#f59e0b" stroke-width="2.4"/>
    <circle cx="100" cy="-10" r="11" fill="#13203a" stroke="#34d399"/><text x="100" y="-6" fill="#6ee7b7" font-size="9" text-anchor="middle">⚡</text>
    <circle cx="70" cy="-10" r="4" fill="#22d3ee"/><line x1="55" y1="-10" x2="80" y2="-10" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#ec)"/>
    <text x="100" y="-26" fill="#a5f3fc" font-size="9" text-anchor="middle">전자 흐름</text>
  </g>
  <g transform="translate(290,84)">
    <text x="0" y="0" fill="#cbd5e1" font-size="10.5" font-weight="700">산화·환원 = 전자 이동</text>
    <text x="0" y="18" fill="#f87171" font-size="9.5">산화: 전자 잃음(산화수↑)</text>
    <text x="0" y="34" fill="#60a5fa" font-size="9.5">환원: 전자 얻음(산화수↓)</text>
    <text x="0" y="50" fill="#94a3b8" font-size="9">→ 항상 동시에 일어남</text>
    <text x="0" y="74" fill="#cbd5e1" font-size="10.5" font-weight="700">전기 화학</text>
    <text x="0" y="92" fill="#6ee7b7" font-size="9">화학전지: 화학E → 전기E</text>
    <text x="0" y="108" fill="#fbbf24" font-size="9">전기분해: 전기E → 화학 반응</text>
  </g>
  <text x="240" y="252" fill="#cbd5e1" font-size="10.5" text-anchor="middle">연료 전지: 수소+산소 → 전기, 물만 배출(친환경)</text>
  <text x="240" y="276" fill="#94a3b8" font-size="10" text-anchor="middle">전기 분해로 알루미늄·구리 정제, 전기 도금</text>
  <text x="240" y="300" fill="#94a3b8" font-size="10" text-anchor="middle">철이 녹스는 것, 연료가 타는 것도 산화·환원</text>
  <defs><marker id="ec" markerWidth="8" markerHeight="8" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#22d3ee"/></marker></defs>
</svg>
