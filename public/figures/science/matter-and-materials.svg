<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">물체와 물질, 그리고 성질</text>
  <text x="240" y="68" fill="#cbd5e1" font-size="12.5" text-anchor="middle">같은 물체(컵)도 여러 물질로 만들 수 있어요</text>
  <!-- 컵 3종 -->
  <g text-anchor="middle">
    <g><path d="M70 96 h56 l-8 64 h-40 z" fill="#67e8f9" opacity="0.55" stroke="#22d3ee"/><text x="98" y="178" fill="#a5f3fc" font-size="11">유리 컵</text></g>
    <g><path d="M212 96 h56 l-8 64 h-40 z" fill="#fca5a5" opacity="0.7" stroke="#f87171"/><text x="240" y="178" fill="#fca5a5" font-size="11">플라스틱 컵</text></g>
    <g><path d="M354 96 h56 l-8 64 h-40 z" fill="#cbd5e1" opacity="0.8" stroke="#94a3b8"/><text x="382" y="178" fill="#cbd5e1" font-size="11">금속 컵</text></g>
  </g>
  <!-- 성질 비교 -->
  <g transform="translate(0,206)" font-size="10.5" text-anchor="middle">
    <text x="240" y="0" fill="#cbd5e1" font-size="12">물질마다 성질이 달라요</text>
    <g><rect x="40" y="14" width="92" height="40" rx="8" fill="#13203a" stroke="#94a3b8"/><text x="86" y="32" fill="#e2e8f0">금속</text><text x="86" y="48" fill="#94a3b8" font-size="9">단단·광택</text></g>
    <g><rect x="150" y="14" width="92" height="40" rx="8" fill="#13203a" stroke="#f87171"/><text x="196" y="32" fill="#e2e8f0">고무</text><text x="196" y="48" fill="#94a3b8" font-size="9">잘 휘어짐</text></g>
    <g><rect x="260" y="14" width="92" height="40" rx="8" fill="#13203a" stroke="#fbbf24"/><text x="306" y="32" fill="#e2e8f0">나무</text><text x="306" y="48" fill="#94a3b8" font-size="9">가벼움·따뜻</text></g>
    <g><rect x="370" y="14" width="70" height="40" rx="8" fill="#13203a" stroke="#34d399"/><text x="405" y="32" fill="#e2e8f0">플라스틱</text><text x="405" y="48" fill="#94a3b8" font-size="9">가볍고 다양</text></g>
  </g>
  <text x="240" y="300" fill="#94a3b8" font-size="10.5" text-anchor="middle">성질에 알맞게 물질을 골라 물체를 만든다 (망치=금속, 타이어=고무)</text>
</svg>
