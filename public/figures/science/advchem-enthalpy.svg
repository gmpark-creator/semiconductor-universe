<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">반응에서의 에너지</text>
  <!-- 발열 에너지 도표 -->
  <g transform="translate(50,70)">
    <line x1="0" y1="160" x2="200" y2="160" stroke="#475569"/><line x1="0" y1="10" x2="0" y2="160" stroke="#475569"/>
    <text x="-6" y="16" fill="#94a3b8" font-size="9" text-anchor="end">에너지</text><text x="100" y="178" fill="#94a3b8" font-size="9" text-anchor="middle">반응 진행 →</text>
    <path d="M10 90 C40 90 50 30 80 30 C110 30 120 130 190 130" fill="none" stroke="#f59e0b" stroke-width="2.6"/>
    <line x1="10" y1="90" x2="80" y2="90" stroke="#34d399" stroke-width="1.4" stroke-dasharray="3 3"/>
    <line x1="80" y1="30" x2="80" y2="90" stroke="#a5b4fc" stroke-width="1.4"/>
    <text x="84" y="56" fill="#c7d2fe" font-size="8.5">활성화E</text>
    <text x="6" y="84" fill="#6ee7b7" font-size="8.5">반응물</text>
    <text x="150" y="124" fill="#6ee7b7" font-size="8.5">생성물</text>
    <line x1="195" y1="90" x2="195" y2="130" stroke="#f87171" stroke-width="1.4" marker-end="url(#en)"/>
    <text x="178" y="108" fill="#fca5a5" font-size="8" text-anchor="end">ΔH&lt;0</text>
  </g>
  <g transform="translate(280,82)">
    <text x="0" y="0" fill="#cbd5e1" font-size="10.5" font-weight="700">엔탈피 H · 반응열</text>
    <text x="0" y="18" fill="#f87171" font-size="9.5">발열: ΔH &lt; 0 (열 방출)</text>
    <text x="0" y="36" fill="#60a5fa" font-size="9.5">흡열: ΔH &gt; 0 (열 흡수)</text>
    <text x="0" y="60" fill="#cbd5e1" font-size="10.5" font-weight="700">촉매</text>
    <text x="0" y="78" fill="#94a3b8" font-size="9">활성화E ↓ → 빠르게(반응열은 그대로)</text>
  </g>
  <text x="240" y="260" fill="#cbd5e1" font-size="10.5" text-anchor="middle">헤스 법칙: 전체 반응열은 경로와 무관, 처음·나중 상태로만 결정</text>
  <text x="240" y="284" fill="#94a3b8" font-size="10" text-anchor="middle">엔탈피는 상태 함수 — 에너지 보존 법칙의 화학적 표현</text>
  <defs><marker id="en" markerWidth="8" markerHeight="8" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#f87171"/></marker></defs>
</svg>
