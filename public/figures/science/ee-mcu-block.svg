<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <defs>
    <marker id="ah-ee-mcu-block" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">마이크로컨트롤러 블록도</text>

  <!-- MCU 칩 외곽 -->
  <rect x="150" y="60" width="180" height="150" rx="10" fill="#131d33" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="76" fill="#cbd5e1" font-size="12" font-weight="700" text-anchor="middle">MCU (마이크로컨트롤러)</text>

  <!-- 내부 버스 -->
  <line x1="240" y1="99" x2="240" y2="183" stroke="#f59e0b" stroke-width="2.5"/>
  <path d="M228 99 h12 M228 141 h12 M228 183 h12" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <path d="M240 99 h12 M240 141 h12 M240 183 h12" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <text x="246" y="141" fill="#fbbf24" font-size="9" text-anchor="middle" transform="rotate(-90 246 141)">내부 버스</text>

  <!-- 좌측 블록 -->
  <rect x="158" y="84" width="70" height="30" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="193" y="103" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">CPU</text>

  <rect x="158" y="126" width="70" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="193" y="145" fill="#e2e8f0" font-size="13" text-anchor="middle">타이머</text>

  <rect x="158" y="168" width="70" height="30" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="193" y="181" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">ADC</text>
  <text x="193" y="192" fill="#94a3b8" font-size="8" text-anchor="middle">아날로그→디지털</text>

  <!-- 우측 블록 -->
  <rect x="252" y="84" width="70" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="287" y="97" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">메모리</text>
  <text x="287" y="109" fill="#94a3b8" font-size="8" text-anchor="middle">RAM · Flash</text>

  <rect x="252" y="126" width="70" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="287" y="139" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">통신</text>
  <text x="287" y="151" fill="#94a3b8" font-size="8" text-anchor="middle">UART · I²C</text>

  <rect x="252" y="168" width="70" height="30" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="287" y="181" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">GPIO</text>
  <text x="287" y="192" fill="#94a3b8" font-size="8" text-anchor="middle">디지털 I/O · PWM</text>

  <!-- 외부 센서 (입력) -->
  <rect x="26" y="168" width="90" height="30" rx="6" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="71" y="183" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">센서</text>
  <text x="71" y="193" fill="#94a3b8" font-size="8" text-anchor="middle">온도·빛·소리 입력</text>

  <!-- 외부 액추에이터 (출력) -->
  <rect x="364" y="168" width="90" height="30" rx="6" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="409" y="183" fill="#e2e8f0" font-size="11" font-weight="700" text-anchor="middle">LED·액추에이터</text>
  <text x="409" y="193" fill="#94a3b8" font-size="8" text-anchor="middle">모터·부저 출력</text>

  <!-- 연결 화살표 -->
  <line x1="116" y1="183" x2="156" y2="183" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah-ee-mcu-block)"/>
  <text x="136" y="163" fill="#22d3ee" font-size="9" text-anchor="middle">입력</text>

  <line x1="324" y1="183" x2="362" y2="183" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah-ee-mcu-block)"/>
  <text x="343" y="163" fill="#fbbf24" font-size="9" text-anchor="middle">PWM</text>

  <text x="240" y="300" fill="#94a3b8" font-size="11" text-anchor="middle">센서 신호는 ADC로 입력, CPU가 처리해 GPIO·PWM으로 LED·액추에이터를 구동</text>
</svg>
