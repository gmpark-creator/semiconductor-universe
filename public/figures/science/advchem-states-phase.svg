<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">물질의 상태와 상변화</text>
  <!-- 가열 곡선 -->
  <g transform="translate(50,70)">
    <line x1="0" y1="150" x2="240" y2="150" stroke="#475569"/><line x1="0" y1="10" x2="0" y2="150" stroke="#475569"/>
    <text x="-6" y="16" fill="#94a3b8" font-size="9" text-anchor="end">온도</text><text x="242" y="164" fill="#94a3b8" font-size="9">가한 열</text>
    <path d="M0 140 L40 100 L100 100 L140 50 L200 50 L240 20" fill="none" stroke="#f59e0b" stroke-width="2.6"/>
    <line x1="40" y1="100" x2="100" y2="100" stroke="#22d3ee" stroke-width="3"/>
    <line x1="140" y1="50" x2="200" y2="50" stroke="#22d3ee" stroke-width="3"/>
    <text x="70" y="94" fill="#a5f3fc" font-size="8" text-anchor="middle">융해(평평)</text>
    <text x="170" y="44" fill="#a5f3fc" font-size="8" text-anchor="middle">끓음(평평)</text>
    <text x="18" y="134" fill="#94a3b8" font-size="8">고체</text><text x="118" y="116" fill="#94a3b8" font-size="8">액체</text><text x="222" y="36" fill="#94a3b8" font-size="8">기체</text>
  </g>
  <g transform="translate(310,84)">
    <text x="0" y="0" fill="#cbd5e1" font-size="10.5" font-weight="700">기체 법칙</text>
    <text x="0" y="18" fill="#94a3b8" font-size="9">압력↑→부피↓ · 온도↑→부피↑</text>
    <text x="0" y="44" fill="#cbd5e1" font-size="10.5" font-weight="700">숨은열(잠열)</text>
    <text x="0" y="62" fill="#fbbf24" font-size="9">상변화 중엔 온도 안 변함</text>
    <text x="0" y="78" fill="#94a3b8" font-size="9">열이 분자 떼는 데 쓰임</text>
  </g>
  <text x="240" y="252" fill="#cbd5e1" font-size="10.5" text-anchor="middle">상태 변화 = 분자 사이 힘 vs 입자 운동 에너지의 경쟁</text>
  <text x="240" y="276" fill="#94a3b8" font-size="10" text-anchor="middle">녹거나 끓을 때 열 흡수, 얼거나 액화할 때 같은 양 방출</text>
  <text x="240" y="300" fill="#94a3b8" font-size="10" text-anchor="middle">땀의 증발(기화열)이 체온을 식힌다</text>
</svg>
