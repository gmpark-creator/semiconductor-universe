<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#070b18"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">계절이 변하는 까닭 (자전축 기울기)</text>
  <!-- 태양 -->
  <circle cx="240" cy="180" r="34" fill="#f59e0b"/>
  <circle cx="240" cy="180" r="34" fill="url(#ss)"/>
  <text x="240" y="184" fill="#7c2d12" font-size="12" font-weight="700" text-anchor="middle">태양</text>
  <!-- 궤도 -->
  <ellipse cx="240" cy="180" rx="180" ry="96" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- 지구 4계절 (자전축 항상 같은 방향으로 기울어짐) -->
  <g>
    <!-- 여름(왼쪽: 북반구가 태양쪽) -->
    <circle cx="60" cy="180" r="22" fill="#1e3a5f" stroke="#38bdf8"/>
    <line x1="52" y1="160" x2="68" y2="200" stroke="#f8fafc" stroke-width="2"/>
    <text x="60" y="232" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">여름</text>
    <!-- 겨울(오른쪽) -->
    <circle cx="420" cy="180" r="22" fill="#1e3a5f" stroke="#38bdf8"/>
    <line x1="412" y1="160" x2="428" y2="200" stroke="#f8fafc" stroke-width="2"/>
    <text x="420" y="232" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">겨울</text>
    <!-- 봄(위) -->
    <circle cx="240" cy="84" r="20" fill="#1e3a5f" stroke="#38bdf8"/>
    <line x1="232" y1="66" x2="248" y2="102" stroke="#f8fafc" stroke-width="2"/>
    <text x="240" y="58" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">봄</text>
    <!-- 가을(아래) -->
    <circle cx="240" cy="276" r="20" fill="#1e3a5f" stroke="#38bdf8"/>
    <line x1="232" y1="258" x2="248" y2="294" stroke="#f8fafc" stroke-width="2"/>
    <text x="240" y="312" fill="#fdba74" font-size="12" font-weight="700" text-anchor="middle">가을</text>
  </g>
  <text x="60" y="150" fill="#cbd5e1" font-size="9.5" text-anchor="middle">남중고도↑ 낮↑</text>
  <text x="420" y="150" fill="#cbd5e1" font-size="9.5" text-anchor="middle">남중고도↓ 낮↓</text>
  <defs><radialGradient id="ss"><stop offset="60%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fde68a"/></radialGradient></defs>
</svg>
