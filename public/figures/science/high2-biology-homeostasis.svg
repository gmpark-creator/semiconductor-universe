<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="homeo-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="immune-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <rect x="20" y="20" width="440" height="280" rx="14" fill="#101827" stroke="#26344f"/>
  <text x="30" y="44" fill="#e2e8f0" font-size="19" font-weight="700">항상성과 몸의 조절</text>
  <text x="30" y="66" fill="#94a3b8" font-size="11">신경계·내분비계·면역계가 내부 환경을 일정 범위로 유지한다</text>

  <g transform="translate(44 92)">
    <rect x="0" y="0" width="170" height="84" rx="14" fill="#111f35" stroke="#60a5fa"/>
    <text x="85" y="20" fill="#bfdbfe" font-size="12" font-weight="700" text-anchor="middle">신경계</text>
    <circle cx="34" cy="48" r="10" fill="#93c5fd"/>
    <path d="M44 48 H94" stroke="#93c5fd" stroke-width="4" marker-end="url(#homeo-arrow)"/>
    <circle cx="112" cy="48" r="6" fill="#fde68a"/>
    <path d="M122 48 H148" stroke="#fbbf24" stroke-width="3" marker-end="url(#homeo-arrow)"/>
    <text x="85" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">활동 전위 → 시냅스 → 반응</text>
  </g>

  <g transform="translate(266 92)">
    <rect x="0" y="0" width="170" height="84" rx="14" fill="#1f1b2e" stroke="#c084fc"/>
    <text x="85" y="20" fill="#ddd6fe" font-size="12" font-weight="700" text-anchor="middle">내분비계</text>
    <path d="M36 54 C60 26 106 26 132 54" fill="none" stroke="#c084fc" stroke-width="3"/>
    <path d="M132 54 C108 82 60 82 36 54" fill="none" stroke="#c084fc" stroke-width="3" marker-end="url(#homeo-arrow)"/>
    <text x="85" y="51" fill="#e9d5ff" font-size="10" text-anchor="middle">음성 피드백</text>
    <text x="85" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">인슐린·글루카곤·체온 조절</text>
  </g>

  <g transform="translate(44 212)">
    <rect x="0" y="0" width="392" height="54" rx="14" fill="#0f2a22" stroke="#34d399"/>
    <text x="22" y="22" fill="#bbf7d0" font-size="12" font-weight="700">면역 반응</text>
    <circle cx="124" cy="28" r="10" fill="#ef4444"/>
    <text x="124" y="32" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">항원</text>
    <path d="M140 28 H186" stroke="#34d399" stroke-width="3" marker-end="url(#immune-arrow)"/>
    <circle cx="206" cy="28" r="13" fill="#22c55e"/>
    <text x="206" y="32" fill="#052e16" font-size="9" font-weight="700" text-anchor="middle">B/T</text>
    <path d="M222 28 H268" stroke="#34d399" stroke-width="3" marker-end="url(#immune-arrow)"/>
    <path d="M292 18 q12 10 0 20 q-12 -10 0 -20" fill="#a7f3d0"/>
    <text x="292" y="46" fill="#bbf7d0" font-size="9" text-anchor="middle">항체</text>
    <circle cx="350" cy="28" r="12" fill="#fde68a"/>
    <text x="350" y="32" fill="#422006" font-size="9" font-weight="700" text-anchor="middle">기억</text>
  </g>

  <text x="240" y="190" fill="#cbd5e1" font-size="12" font-weight="700" text-anchor="middle">항상성 = 감지 → 조절 중추 → 반응기 → 기준 범위 회복</text>
  <text x="240" y="292" fill="#94a3b8" font-size="10" text-anchor="middle">백신은 항원 정보를 안전하게 경험시켜 면역 기억을 준비시키는 기술이다</text>
</svg>
