<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">산화·환원과 화학 전지</text>
  <!-- 산화/환원 정의 -->
  <g transform="translate(40,64)">
    <rect x="0" y="0" width="190" height="56" rx="10" fill="#13203a" stroke="#f87171"/>
    <text x="95" y="24" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">산화 = 전자 잃음</text>
    <text x="95" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">산소 얻음 / 산화수 ↑</text>
  </g>
  <g transform="translate(250,64)">
    <rect x="0" y="0" width="190" height="56" rx="10" fill="#13203a" stroke="#34d399"/>
    <text x="95" y="24" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">환원 = 전자 얻음</text>
    <text x="95" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">산소 잃음 / 산화수 ↓</text>
  </g>
  <text x="240" y="142" fill="#cbd5e1" font-size="11" text-anchor="middle">산화와 환원은 항상 동시에 (전자가 옮겨 간다)</text>
  <!-- 화학 전지 -->
  <g transform="translate(0,164)">
    <rect x="80" y="20" width="40" height="70" fill="#94a3b8"/><text x="100" y="106" fill="#fca5a5" font-size="11" text-anchor="middle">(−) 산화</text>
    <rect x="360" y="20" width="40" height="70" fill="#cbd5e1"/><text x="380" y="106" fill="#6ee7b7" font-size="11" text-anchor="middle">(+) 환원</text>
    <rect x="120" y="40" width="240" height="50" rx="6" fill="#155e75" opacity="0.5"/>
    <path d="M100 20 V6 H380 V20" fill="none" stroke="#fde047" stroke-width="3"/>
    <circle cx="240" cy="6" r="9" fill="#1e293b" stroke="#fde047"/><text x="240" y="10" fill="#fde047" font-size="9" text-anchor="middle">전구</text>
    <g fill="#38bdf8"><circle cx="160" cy="6" r="3"/><circle cx="320" cy="6" r="3"/></g>
    <text x="200" y="-2" fill="#7dd3fc" font-size="9" text-anchor="middle">전자 e⁻ →</text>
  </g>
  <text x="240" y="298" fill="#fbbf24" font-size="11" text-anchor="middle">▶ 전자의 흐름 = 전류 — 배터리는 산업영역 「전력」으로 이어진다</text>
</svg>
