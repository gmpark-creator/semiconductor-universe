<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">기준을 정해 동물 분류하기</text>
  <!-- 루트 -->
  <rect x="190" y="58" width="100" height="34" rx="8" fill="#14532d" stroke="#34d399" stroke-width="1.5"/>
  <text x="240" y="80" fill="#bbf7d0" font-size="13" font-weight="700" text-anchor="middle">동물</text>
  <!-- 가지 -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <path d="M240 92 L120 130"/><path d="M240 92 L360 130"/>
  </g>
  <rect x="60" y="130" width="120" height="30" rx="8" fill="#13203a" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="120" y="150" fill="#7dd3fc" font-size="12" text-anchor="middle">다리가 있다</text>
  <rect x="300" y="130" width="120" height="30" rx="8" fill="#13203a" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="360" y="150" fill="#7dd3fc" font-size="12" text-anchor="middle">다리가 없다</text>
  <!-- 예시 동물 -->
  <g text-anchor="middle" font-size="11" fill="#cbd5e1">
    <circle cx="84" cy="208" r="20" fill="#1e293b"/><text x="84" y="212" font-size="20">🐕</text><text x="84" y="244">개</text>
    <circle cx="156" cy="208" r="20" fill="#1e293b"/><text x="156" y="212" font-size="20">🐦</text><text x="156" y="244">참새</text>
    <circle cx="324" cy="208" r="20" fill="#1e293b"/><text x="324" y="213" font-size="20">🐟</text><text x="324" y="244">붕어</text>
    <circle cx="396" cy="208" r="20" fill="#1e293b"/><text x="396" y="213" font-size="20">🐍</text><text x="396" y="244">뱀</text>
  </g>
  <text x="240" y="288" fill="#94a3b8" font-size="11" text-anchor="middle">누가 나눠도 같은 결과가 나오는 분명한 기준을 세우는 것이 중요하다</text>
</svg>
