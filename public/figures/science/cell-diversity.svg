<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="480" height="320" rx="16" fill="#0f1729"/>
  <text x="24" y="38" fill="#e2e8f0" font-size="19" font-weight="700">생물의 구성 단계</text>
  <g text-anchor="middle" font-size="11.5">
    <g><circle cx="56" cy="150" r="20" fill="#34d399"/><circle cx="50" cy="146" r="5" fill="#065f46"/><text x="56" y="190" fill="#6ee7b7" font-weight="700">세포</text></g>
    <g><rect x="100" y="132" width="56" height="36" rx="6" fill="#10b981"/><text x="128" y="190" fill="#6ee7b7" font-weight="700">조직</text></g>
    <g><path d="M196 132 q28 -10 52 8 q-6 30 -30 30 q-28 -4 -22 -38z" fill="#059669"/><text x="222" y="190" fill="#6ee7b7" font-weight="700">기관</text></g>
    <g><rect x="280" y="126" width="48" height="48" rx="8" fill="#047857"/><circle cx="304" cy="150" r="14" fill="#34d399"/><text x="304" y="190" fill="#6ee7b7" font-weight="700">기관계</text></g>
    <g><circle cx="408" cy="150" r="26" fill="none" stroke="#34d399" stroke-width="2"/><text x="408" y="156" font-size="20">🐢</text><text x="408" y="190" fill="#6ee7b7" font-weight="700">개체</text></g>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#c1)">
    <line x1="80" y1="150" x2="96" y2="150"/><line x1="160" y1="150" x2="190" y2="150"/><line x1="252" y1="150" x2="276" y2="150"/><line x1="332" y1="150" x2="378" y2="150"/>
  </g>
  <text x="240" y="246" fill="#cbd5e1" font-size="12" text-anchor="middle">세포 → 조직 → 기관 → 기관계 → 개체</text>
  <text x="240" y="276" fill="#94a3b8" font-size="11" text-anchor="middle">지구에는 분류로 정리하는 다양한 종(생물다양성)이 살아간다</text>
  <defs><marker id="c1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#64748b"/></marker></defs>
